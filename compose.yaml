# Local stack. Values come from .env (see .env.example).
#   scripts/db.sh up       -> PostgreSQL + Redis only (run the app with scripts/dev.sh)
#   scripts/docker.sh up   -> PostgreSQL + Redis + app image ("app" profile)
#   docker compose --profile monitoring up -d -> Prometheus (http://localhost:9090) with the alert
#                            rules and Grafana (http://localhost:3001, admin/admin) with the dashboard
name: spring-boot-template

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Redis also holds security state (login lockouts, revoked tokens), which must never be evicted:
    # with "noeviction" a full Redis rejects writes instead of silently dropping keys. Every key has a TTL.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every email sent in development. Web UI: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:8025:8025"

  app:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # The container always listens on 8080; PORT from .env only moves the host port below.
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      # Local only, like the other services: this profile has the API docs on and Secure cookies off.
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No healthcheck: the image is distroless (no shell or HTTP client). Readiness is at /actuator/health/readiness.
    security_opt:
      - no-new-privileges:true

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,z
    # Lets Prometheus scrape the app running on the host (scripts/dev.sh).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
