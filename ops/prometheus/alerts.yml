# Prometheus alerting rules for the application. Load them with `rule_files` (see prometheus.yml)
# and route the alerts with Alertmanager. Thresholds are starting points: tune them to your traffic.
# Each alert has a runbook in the Runbooks guide (docs/src/content/docs/guides/runbooks.md).
groups:
  # Service level objectives for /api/v1/** over 30 days:
  #   availability: 99.5% of requests do not fail with 5xx (error budget 0.5%)
  #   latency:      95% of requests complete within 300ms (budget 5%)
  # Multi-window, multi-burn-rate alerts (Google SRE workbook): a fast burn pages, a slow burn opens a ticket.
  - name: slo
    rules:
      - record: slo:api_errors:ratio_rate5m
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*", outcome="SERVER_ERROR"}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*"}[5m]))
      - record: slo:api_errors:ratio_rate30m
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*", outcome="SERVER_ERROR"}[30m]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*"}[30m]))
      - record: slo:api_errors:ratio_rate1h
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*", outcome="SERVER_ERROR"}[1h]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*"}[1h]))
      - record: slo:api_errors:ratio_rate6h
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*", outcome="SERVER_ERROR"}[6h]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*"}[6h]))
      - record: slo:api_slow:ratio_rate1h
        expr: |
          1 - sum by (application) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/.*", le="0.3"}[1h]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*"}[1h]))
      - record: slo:api_slow:ratio_rate6h
        expr: |
          1 - sum by (application) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/.*", le="0.3"}[6h]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri=~"/api/v1/.*"}[6h]))

      # 14.4x burn: 2% of the 30-day budget in one hour.
      - alert: ErrorBudgetFastBurn
        expr: slo:api_errors:ratio_rate1h > (14.4 * 0.005) and slo:api_errors:ratio_rate5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Availability SLO: error budget burning 14x too fast"
          description: "{{ $labels.application }} fails {{ $value | humanizePercentage }} of /api/v1 requests; at this rate the 30-day budget is gone in about two days."

      # 6x burn: 5% of the budget in six hours.
      - alert: ErrorBudgetSlowBurn
        expr: slo:api_errors:ratio_rate6h > (6 * 0.005) and slo:api_errors:ratio_rate30m > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Availability SLO: error budget burning 6x too fast"
          description: "{{ $labels.application }} fails {{ $value | humanizePercentage }} of /api/v1 requests over 6 hours."

      - alert: LatencyBudgetBurn
        expr: slo:api_slow:ratio_rate6h > (6 * 0.05) and slo:api_slow:ratio_rate1h > (6 * 0.05)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Latency SLO: too many requests slower than 300ms"
          description: "{{ $value | humanizePercentage }} of {{ $labels.application }} /api/v1 requests take longer than 300ms (objective: 5%)."

  - name: availability
    rules:
      - alert: AppInstanceDown
        expr: up{job="app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 2 minutes."

      - alert: HighServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of requests fail with 5xx"
          description: "{{ $value | humanizePercentage }} of {{ $labels.application }} requests return 5xx. Look up the X-Trace-Id of a failing request in the logs."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (application, le) (
            rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s"
          description: "95th percentile latency of {{ $labels.application }} is {{ $value | humanizeDuration }}."

  - name: security
    rules:
      - alert: LoginFailureSpike
        expr: sum by (application) (rate(security_audit_events_total{event="auth.login_failed"}[5m])) * 60 > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 30 failed logins per minute"
          description: "Possible credential stuffing against {{ $labels.application }}. Check the 'audit' log for the client IPs."

      - alert: RefreshTokenReused
        expr: sum by (application) (increase(security_audit_events_total{event="auth.refresh_token_reused"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A refresh token was used twice"
          description: "A copied refresh token was presented; the session was revoked. Check the 'audit' log for the user and IP."

      - alert: PrivilegeChanges
        expr: sum by (application) (increase(security_audit_events_total{event="admin.role_changed"}[5m])) > 0
        labels:
          severity: info
        annotations:
          summary: "A user's role was changed"
          description: "An administrator changed a role. Confirm it was intended (see the 'audit' log)."

      # Redis did not answer and a protection let the request through (ADR 2): rate limit, token revocation, sign-up
      # link reuse or the sign-up email cooldown. The counters exist from startup, so the first failure is seen too.
      - alert: SecurityControlFailingOpen
        expr: sum by (application, control) (increase(security_fail_open_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Security control {{ $labels.control }} fails open"
          description: "{{ $labels.application }} let requests through {{ $labels.control }} unchecked because Redis did not answer. See the WarningLogSpike runbook (Redis unreachable)."

  - name: logs
    rules:
      # Log-based alerts from the logback_events_total counter (every log line, by level).
      - alert: ErrorLogs
        expr: sum by (application, instance) (increase(logback_events_total{level="error"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Errors logged"
          description: "{{ $labels.instance }} logged {{ $value }} errors in 10 minutes. Search the logs for level ERROR."

      # The Redis-backed protections log a warning when Redis is unreachable (login then fails closed, the rest fail
      # open), so a burst of warnings usually means Redis is down.
      - alert: WarningLogSpike
        expr: sum by (application, instance) (rate(logback_events_total{level="warn"}[5m])) * 60 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 warnings per minute"
          description: "{{ $labels.instance }} logs {{ $value }} warnings per minute; check for 'Could not' and 'Rate limit check failed' (Redis unreachable)."

  - name: email
    rules:
      - alert: EmailsDropped
        expr: sum by (application) (increase(mail_outbox_dropped_total[1h])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Emails were given up after all retries"
          description: "Users did not receive verification, password reset or security alert emails. They are kept as dead letters (failed_at); fix SMTP, then re-queue them (runbooks: EmailsDropped)."

      - alert: EmailBacklog
        expr: max by (application) (mail_outbox_pending) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 100 emails waiting"
          description: "The email outbox of {{ $labels.application }} is not draining; SMTP may be down or slow."

  - name: webhooks
    rules:
      # One broken receiver is its owner's problem; most deliveries failing at once points at the app (egress, DNS).
      - alert: WebhookDeliveriesFailing
        expr: |
          sum by (application) (increase(webhook_deliveries_total{outcome=~"retry|failed"}[30m]))
            / sum by (application) (increase(webhook_deliveries_total{outcome=~"sent|retry|failed"}[30m])) > 0.5
          and sum by (application) (increase(webhook_deliveries_total{outcome=~"sent|retry|failed"}[30m])) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Most webhook deliveries fail"
          description: "{{ $value | humanizePercentage }} of the webhook deliveries of {{ $labels.application }} failed in the last 30 minutes; check egress and DNS (runbooks: WebhookDeliveriesFailing)."

  - name: background
    rules:
      # @Scheduled methods are timed as tasks_scheduled_execution_seconds (outbox, token and account cleanup).
      - alert: ScheduledTaskFailing
        expr: sum by (application, code_function) (increase(tasks_scheduled_execution_seconds_count{outcome="ERROR"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Scheduled task {{ $labels.code_function }} fails"
          description: "A background job of {{ $labels.application }} threw an exception in the last 30 minutes. Check the logs."

  - name: resources
    rules:
      - alert: DatabasePoolExhausted
        expr: max by (application, instance) (hikaricp_connections_pending) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests are waiting for database connections"
          description: "{{ $labels.instance }} has had threads waiting for a connection for 5 minutes. Raise DB_POOL_SIZE or look for slow queries."

      - alert: HeapAlmostFull
        expr: |
          sum by (application, instance) (jvm_memory_used_bytes{area="heap"})
            / sum by (application, instance) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap usage above 90%"
          description: "{{ $labels.instance }} uses {{ $value | humanizePercentage }} of its heap. Raise the container memory limit."

      # Needs kube-state-metrics. The JVM exits on OutOfMemoryError by itself; an OOM kill means the container's
      # memory limit is too small for the heap plus native memory (metaspace, thread stacks, direct buffers).
      - alert: ContainerOOMKilled
        expr: |
          max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container="app"})
            and on (namespace, pod, container) increase(kube_pod_container_status_restarts_total{container="app"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} was OOM-killed"
          description: "The kernel killed container {{ $labels.container }} of {{ $labels.namespace }}/{{ $labels.pod }} for exceeding its memory limit in the last 15 minutes."
