<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 624" width="720" height="624" role="img" aria-labelledby="session-invalidation-title session-invalidation-desc"><title id="session-invalidation-title">Ending every session of a user</title><desc id="session-invalidation-desc">A password or role change, or deleting the user, deletes the user&#x27;s refresh tokens in the same transaction and, once it commits, sets a cut-off in Redis that rejects every access token issued before it.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#23262f;font-size:14px;font-weight:600}
.sub{fill:#555962;font-size:11.5px}
.lbl{fill:#555962;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#3d50f5;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#555962;font-size:8.5px;letter-spacing:.1em}
.note{fill:#555962;font-size:13px;font-style:italic}
.bg,.mask{fill:#ffffff} .mask-zone{fill:#f6f7f9}
.box{fill:#ffffff;stroke:#888c96;stroke-width:1}
.box-focal{fill:#eff1fe;stroke:#3d50f5;stroke-width:1.5}
.box-ext{fill:#ffffff;stroke:#888c96;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#f6f7f9;stroke:#c1c3c8;stroke-width:.8}
.frame{fill:none;stroke:#888c96;stroke-width:.8}
.chip{fill:none;stroke:#c1c3c8;stroke-width:.8}
.w{fill:none;stroke:#555962;stroke-width:1.2}
.w-accent{fill:none;stroke:#3d50f5;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#c1c3c8;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#c1c3c8;stroke-width:.8}
.m{fill:#555962} .m-accent{fill:#3d50f5} .m-open{fill:none;stroke:#555962;stroke-width:1.2}
.dot{fill:#23262f}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><line class="life" x1="96" y1="72" x2="96" y2="556"/><line class="life" x1="280" y1="72" x2="280" y2="556"/><line class="life" x1="464" y1="72" x2="464" y2="556"/><line class="life" x1="636" y1="72" x2="636" y2="556"/><path class="w" d="M96,108 L280,108" marker-end="url(#a)"/><path class="w" d="M280,144 L464,144" marker-end="url(#a)"/><path class="w" d="M280,180 L300,180 Q308,180 308,188 L308,192 Q308,200 300,200 L282,200" marker-end="url(#a)"/><path class="w" d="M280,236 L464,236" marker-end="url(#a)"/><path class="w" d="M280,272 L636,272" marker-end="url(#a)"/><path class="w dash" d="M280,308 L96,308" marker-end="url(#a)"/><line class="sep" x1="24" y1="348" x2="290.7" y2="348"/><line class="sep" x1="453.3" y1="348" x2="696" y2="348"/><path class="w" d="M96,388 L280,388" marker-end="url(#a)"/><path class="w" d="M280,424 L636,424" marker-end="url(#a)"/><path class="w-accent" d="M280,460 L96,460" marker-end="url(#a-accent)"/><path class="w" d="M96,496 L280,496" marker-end="url(#a)"/><path class="w dash" d="M280,532 L96,532" marker-end="url(#a)"/><rect class="mask" x="115.7" y="90.6" width="144.6" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="99" text-anchor="middle">change password/role</text><rect class="mask" x="292.8" y="126.6" width="158.5" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="135" text-anchor="middle">UPDATE user, version+1</text><rect class="mask" x="315.0" y="184.6" width="137.7" height="11.6" rx="2"/><text class="lbl mono" x="318" y="193.0" text-anchor="start">SessionsInvalidated</text><rect class="mask" x="296.2" y="218.6" width="151.5" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="227" text-anchor="middle">DELETE refresh tokens</text><rect class="mask" x="474.2" y="254.6" width="151.5" height="11.6" rx="2"/><text class="lbl mono" x="550" y="263" text-anchor="middle">after commit: cut-off</text><rect class="mask" x="174.6" y="290.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="299" text-anchor="middle">204</text><rect class="mask" x="299.7" y="342.6" width="144.6" height="11.6" rx="2"/><text class="lbl mono" x="372" y="351" text-anchor="middle">OTHER DEVICES, LATER</text><rect class="mask" x="129.6" y="370.6" width="116.9" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="379" text-anchor="middle">request, old JWT</text><rect class="mask" x="470.8" y="406.6" width="158.5" height="11.6" rx="2"/><text class="lbl mono" x="550" y="415" text-anchor="middle">issued before cut-off?</text><rect class="mask" x="174.6" y="442.6" width="26.8" height="11.6" rx="2"/><text class="lbl-accent mono" x="188.0" y="451" text-anchor="middle">401</text><rect class="mask" x="122.6" y="478.6" width="130.7" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="487" text-anchor="middle">POST /auth/refresh</text><rect class="mask" x="133.0" y="514.6" width="110.0" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="523" text-anchor="middle">401, token gone</text><text class="note" x="360" y="588" text-anchor="middle">Refresh tokens are deleted in the same transaction as the change;</text><text class="note" x="360" y="608" text-anchor="middle">access tokens are cut off in Redis once it commits.</text><rect class="mask" x="14.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="14.0" y="20" width="164" height="52" rx="6"/><text class="name" x="96.0" y="43.5" text-anchor="middle">Client</text><text class="sub mono" x="96.0" y="59.5" text-anchor="middle">any device</text><rect class="mask" x="198.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="198.0" y="20" width="164" height="52" rx="6"/><text class="name" x="280.0" y="43.5" text-anchor="middle">Spring Boot API</text><text class="sub mono" x="280.0" y="59.5" text-anchor="middle">UserService</text><rect class="mask" x="382.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="382.0" y="20" width="164" height="52" rx="6"/><text class="name" x="464.0" y="43.5" text-anchor="middle">PostgreSQL</text><text class="sub mono" x="464.0" y="59.5" text-anchor="middle">refresh_tokens</text><rect class="mask" x="554.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="554.0" y="20" width="164" height="52" rx="6"/><text class="name" x="636.0" y="43.5" text-anchor="middle">Redis</text><text class="sub mono" x="636.0" y="59.5" text-anchor="middle">revocation</text></svg>
