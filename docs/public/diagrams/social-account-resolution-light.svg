="lbl mono" x="310" y="551" text-anchor="start">YES</text><rect class="mask" x="538.6" y="82.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="552" y="91" text-anchor="middle">YES</text><rect class="mask" x="434.1" y="210.6" width="19.9" height="11.6" rx="2"/><text class="lbl mono" x="444" y="219" text-anchor="middle">NO</text><rect class="mask" x="434.1" y="466.6" width="19.9" height="11.6" rx="2"/><text class="lbl mono" x="444" y="475" text-anchor="middle">NO</text><rect class="mask" x="158.1" y="338.6" width="19.9" height="11.6" rx="2"/><text class="lbl mono" x="168" y="347" text-anchor="middle">NO</text><polygon class="mask" points="300.0,56 416,100.0 300.0,144 184,100.0"/><polygon class="box" points="300.0,56 416,100.0 300.0,144 184,100.0"/><text class="name" x="300.0" y="97.5" text-anchor="middle">Linked before?</text><text class="sub mono" x="300.0" y="113.5" text-anchor="middle">provider + subject</text><polygon class="mask" points="300.0,184 416,228.0 300.0,272 184,228.0"/><polygon class="box" points="300.0,184 416,228.0 300.0,272 184,228.0"/><text class="name" x="300.0" y="225.5" text-anchor="middle">Verified email?</text><text class="sub mono" x="300.0" y="241.5" text-anchor="middle">from the provider</text><polygon class="mask" points="300.0,312 416,356.0 300.0,400 184,356.0"/><polygon class="box" points="300.0,312 416,356.0 300.0,400 184,356.0"/><text class="name" x="300.0" y="353.5" text-anchor="middle">Email has a user?</text><text class="sub mono" x="300.0" y="369.5" text-anchor="middle">users.email</text><polygon class="mask" points="300.0,440 416,484.0 300.0,528 184,484.0"/><polygon class="box" points="300.0,440 416,484.0 300.0,528 184,484.0"/><text class="name" x="300.0" y="481.5" text-anchor="middle">User verified it?</text><text class="sub mono" x="300.0" y="497.5" text-anchor="middle">email_verified</text><rect class="mask" x="16" y="328" width="136" height="52" rx="6"/><rect class="box" x="16" y="328" width="136" height="52" rx="