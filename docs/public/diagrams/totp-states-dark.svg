<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" width="720" height="496" role="img" aria-labelledby="totp-states-title totp-states-desc"><title id="totp-states-title">Two-factor enrollment states</title><desc id="totp-states-desc">Requesting a secret moves two-factor authentication from off to pending, confirming it with the password and a first code turns it on, and turning it off needs the password and a code.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><circle class="dot" cx="360" cy="16" r="5"/><path class="w" d="M360,21 L360,40" marker-end="url(#a)"/><path class="w" d="M360,120 L360,176" marker-end="url(#a)"/><path class="w" d="M480,200 L516,200 Q524,200 524,208 L524,224 Q524,232 516,232 L480,232" marker-end="url(#a)"/><path class="w-accent" d="M360,256 L360,312" marker-end="url(#a-accent)"/><path class="w" d="M240,352 L88,352 Q80,352 80,344 L80,88 Q80,80 88,80 L240,80" marker-end="url(#a)"/><rect class="mask" x="369.0" y="135.6" width="75.3" height="11.6" rx="2"/><text class="lbl mono" x="372" y="144" text-anchor="start">POST /totp</text><rect class="mask" x="369.0" y="148.6" width="75.3" height="11.6" rx="2"/><text class="lbl mono" x="372" y="157" text-anchor="start">new secret</text><rect class="mask" x="533.0" y="203.6" width="75.3" height="11.6" rx="2"/><text class="lbl mono" x="536" y="212" text-anchor="start">POST /totp</text><rect class="mask" x="533.0" y="216.6" width="75.3" height="11.6" rx="2"/><text class="lbl mono" x="536" y="225" text-anchor="start">new secret</text><rect class="mask" x="369.0" y="271.6" width="96.1" height="11.6" rx="2"/><text class="lbl-accent mono" x="372" y="280" text-anchor="start">POST /confirm</text><rect class="mask" x="369.0" y="284.6" width="96.1" height="11.6" rx="2"/><text class="lbl-accent mono" x="372" y="293" text-anchor="start">password+code</text><rect class="mask" x="89.0" y="201.6" width="89.2" height="11.6" rx="2"/><text class="lbl mono" x="92" y="210" text-anchor="start">DELETE /totp</text><rect class="mask" x="89.0" y="214.6" width="96.1" height="11.6" rx="2"/><text class="lbl mono" x="92" y="223" text-anchor="start">password+code</text><text class="note" x="360" y="436" text-anchor="middle">While pending, DELETE /totp answers 409 and login is unchanged;</text><text class="note" x="360" y="456" text-anchor="middle">only confirming turns it on. Turning it off deletes the secret and</text><text class="note" x="360" y="476" text-anchor="middle">every recovery code; POST /totp while enabled answers 409.</text><rect class="mask" x="240" y="40" width="240" height="80" rx="6"/><rect class="box" x="240" y="40" width="240" height="80" rx="6"/><rect class="chip" x="248" y="48" width="41" height="12" rx="2"/><text class="tag mono" x="253" y="57.5">STATE</text><text class="name" x="360.0" y="79.5" text-anchor="middle">Off</text><text class="sub mono" x="360.0" y="95.5" text-anchor="middle">totp_secret = null</text><text class="sub mono" x="360.0" y="111.5" text-anchor="middle">login: password only</text><rect class="mask" x="240" y="176" width="240" height="80" rx="6"/><rect class="box" x="240" y="176" width="240" height="80" rx="6"/><rect class="chip" x="248" y="184" width="41" height="12" rx="2"/><text class="tag mono" x="253" y="193.5">STATE</text><text class="name" x="360.0" y="215.5" text-anchor="middle">Pending</text><text class="sub mono" x="360.0" y="231.5" text-anchor="middle">secret stored, encrypted</text><text class="sub mono" x="360.0" y="247.5" text-anchor="middle">login: password only</text><rect class="mask" x="240" y="312" width="240" height="80" rx="6"/><rect class="box-focal" x="240" y="312" width="240" height="80" rx="6"/><rect class="chip" x="248" y="320" width="41" height="12" rx="2"/><text class="tag mono" x="253" y="329.5">STATE</text><text class="name" x="360.0" y="351.5" text-anchor="middle">Enabled</text><text class="sub mono" x="360.0" y="367.5" text-anchor="middle">10 recovery codes, once</text><text class="sub mono" x="360.0" y="383.5" text-anchor="middle">login: password + code</text></svg>
