<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 816" width="720" height="816" role="img" aria-labelledby="request-pipeline-title request-pipeline-desc"><title id="request-pipeline-title">How a request is checked</title><desc id="request-pipeline-desc">Every request passes the trace, rate-limit and CSRF filters; public paths go straight to the controller, other requests need a valid, unrevoked JWT and the right role; every rejection and exception becomes an RFC 9457 problem detail.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#23262f;font-size:14px;font-weight:600}
.sub{fill:#555962;font-size:11.5px}
.lbl{fill:#555962;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#3d50f5;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#555962;font-size:8.5px;letter-spacing:.1em}
.note{fill:#555962;font-size:13px;font-style:italic}
.bg,.mask{fill:#ffffff} .mask-zone{fill:#f6f7f9}
.box{fill:#ffffff;stroke:#888c96;stroke-width:1}
.box-focal{fill:#eff1fe;stroke:#3d50f5;stroke-width:1.5}
.box-ext{fill:#ffffff;stroke:#888c96;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#f6f7f9;stroke:#c1c3c8;stroke-width:.8}
.frame{fill:none;stroke:#888c96;stroke-width:.8}
.chip{fill:none;stroke:#c1c3c8;stroke-width:.8}
.w{fill:none;stroke:#555962;stroke-width:1.2}
.w-accent{fill:none;stroke:#3d50f5;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#c1c3c8;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#c1c3c8;stroke-width:.8}
.m{fill:#555962} .m-accent{fill:#3d50f5} .m-open{fill:none;stroke:#555962;stroke-width:1.2}
.dot{fill:#23262f}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><path class="w" d="M280,64 L280,104" marker-end="url(#a)"/><path class="w" d="M280,192 L280,232" marker-end="url(#a)"/><path class="w" d="M280,320 L280,360" marker-end="url(#a)"/><path class="w" d="M280,448 L280,488" marker-end="url(#a)"/><path class="w" d="M280,576 L280,616" marker-end="url(#a)"/><path class="w-accent" d="M280,704 L280,744" marker-end="url(#a-accent)"/><path class="w" d="M396,148 L520,148" marker-end="url(#a)"/><path class="w" d="M396,276 L520,276" marker-end="url(#a)"/><path class="w" d="M396,532 L520,532" marker-end="url(#a)"/><path class="w" d="M396,660 L520,660" marker-end="url(#a)"/><path class="w" d="M164,404 L120,404 Q112,404 112,412 L112,760 Q112,768 120,768 L200,768" marker-end="url(#a)"/><path class="w dash" d="M360,768 L600,768 Q608,768 608,760 L608,688" marker-end="url(#a)"/><rect class="mask" x="287.0" y="206.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="290" y="215.0" text-anchor="start">PASS</text><rect class="mask" x="287.0" y="334.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="290" y="343.0" text-anchor="start">PASS</text><rect class="mask" x="287.0" y="462.6" width="19.9" height="11.6" rx="2"/><text class="lbl mono" x="290" y="471.0" text-anchor="start">NO</text><rect class="mask" x="287.0" y="590.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="290" y="599.0" text-anchor="start">PASS</text><rect class="mask" x="287.0" y="718.6" width="33.7" height="11.6" rx="2"/><text class="lbl-accent mono" x="290" y="727" text-anchor="start">PASS</text><rect class="mask" x="444.6" y="130.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="139" text-anchor="middle">429</text><rect class="mask" x="444.6" y="258.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="267" text-anchor="middle">403</text><rect class="mask" x="444.6" y="514.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="523" text-anchor="middle">401</text><rect class="mask" x="444.6" y="642.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="651" text-anchor="middle">403</text><rect class="mask" x="4.0" y="581.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="104" y="590" text-anchor="end">YES · NO TOKEN</text><rect class="mask" x="445.8" y="750.6" width="68.4" height="11.6" rx="2"/><text class="lbl mono" x="480" y="759" text-anchor="middle">EXCEPTION</text><rect class="mask" x="180" y="24" width="200" height="40" rx="20.0"/><rect class="box" x="180" y="24" width="200" height="40" rx="20.0"/><text class="name" x="280.0" y="49.5" text-anchor="middle">HTTP request</text><polygon class="mask" points="280.0,104 396,148.0 280.0,192 164,148.0"/><polygon class="box" points="280.0,104 396,148.0 280.0,192 164,148.0"/><text class="name" x="280.0" y="145.5" text-anchor="middle">Rate limit</text><text class="sub mono" x="280.0" y="161.5" text-anchor="middle">RateLimitFilter</text><polygon class="mask" points="280.0,232 396,276.0 280.0,320 164,276.0"/><polygon class="box" points="280.0,232 396,276.0 280.0,320 164,276.0"/><text class="name" x="280.0" y="273.5" text-anchor="middle">CSRF origin</text><text class="sub mono" x="280.0" y="289.5" text-anchor="middle">CookieCsrfFilter</text><polygon class="mask" points="280.0,360 396,404.0 280.0,448 164,404.0"/><polygon class="box" points="280.0,360 396,404.0 280.0,448 164,404.0"/><text class="name" x="280.0" y="401.5" text-anchor="middle">Public path?</text><text class="sub mono" x="280.0" y="417.5" text-anchor="middle">SecurityFilterChain</text><polygon class="mask" points="280.0,488 396,532.0 280.0,576 164,532.0"/><polygon class="box-focal" points="280.0,488 396,532.0 280.0,576 164,532.0"/><text class="name" x="280.0" y="529.5" text-anchor="middle">JWT + revocation</text><text class="sub mono" x="280.0" y="545.5" text-anchor="middle">JwtDecoder · Redis</text><polygon class="mask" points="280.0,616 396,660.0 280.0,704 164,660.0"/><polygon class="box" points="280.0,616 396,660.0 280.0,704 164,660.0"/><text class="name" x="280.0" y="657.5" text-anchor="middle">Role</text><text class="sub mono" x="280.0" y="673.5" text-anchor="middle">@PreAuthorize</text><rect class="mask" x="200" y="744" width="160" height="48" rx="24.0"/><rect class="box" x="200" y="744" width="160" height="48" rx="24.0"/><text class="name" x="280.0" y="773.5" text-anchor="middle">Controller</text><rect class="mask" x="520" y="120" width="176" height="568" rx="6"/><rect class="box" x="520" y="120" width="176" height="568" rx="6"/><text class="name" x="608.0" y="385.5" text-anchor="middle">Problem detail</text><text class="sub mono" x="608.0" y="401.5" text-anchor="middle">RFC 9457 JSON</text><text class="sub mono" x="608.0" y="417.5" text-anchor="middle">SecurityProblemHandler</text><text class="sub mono" x="608.0" y="433.5" text-anchor="middle">GlobalExceptionHandler</text></svg>
