="471.0" text-anchor="start">NO</text><rect class="mask" x="287.0" y="590.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="290" y="599.0" text-anchor="start">PASS</text><rect class="mask" x="287.0" y="718.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="290" y="727.0" text-anchor="start">PASS</text><rect class="mask" x="287.0" y="846.6" width="116.9" height="11.6" rx="2"/><text class="lbl-accent mono" x="290" y="855" text-anchor="start">NO KEY · NEW KEY</text><rect class="mask" x="444.6" y="130.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="139" text-anchor="middle">429</text><rect class="mask" x="444.6" y="258.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="267" text-anchor="middle">403</text><rect class="mask" x="444.6" y="514.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="523" text-anchor="middle">401</text><rect class="mask" x="444.6" y="642.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="458" y="651" text-anchor="middle">403</text><rect class="mask" x="423.8" y="770.6" width="68.4" height="11.6" rx="2"/><text class="lbl mono" x="458" y="779" text-anchor="middle">409 · 422</text><rect class="mask" x="45.0" y="581.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="48" y="590" text-anchor="start">YES · NO TOKEN</text><rect class="mask" x="65.4" y="804.6" width="47.6" height="11.6" rx="2"/><text class="lbl mono" x="110" y="813" text-anchor="end">REPLAY</text><rect class="mask" x="445.8" y="878.6" width="68.4" height="11.6" rx="2"/><text class="lbl mono" x="480" y="887" text-anchor="middle">EXCEPTION</text><rect class="mask" x="180" y="24" width="200" height="40" rx="20.0"/><rect class="box" x="180" y="24" width="200" height="40" rx="20.0"/><text class="name" x="280.0" y="49.5" text-anchor="middle">HTTP request</text><polygon class="mask" points="280.0,104 396,148.0 280.0,192 164,148.0"/><polygon class="box" points="280.0,104 396,148.