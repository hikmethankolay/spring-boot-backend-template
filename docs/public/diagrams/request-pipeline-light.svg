869.5" text-anchor="middle">stored response</text><rect class="mask" x="200" y="872" width="160" height="48" rx="24.0"/><rect class="box" x="200" y="872" width="160" height="48" rx="24.0"/><text class="name" x="280.0" y="901.5" text-anchor="middle">Controller</text><rect class="mask" x="520" y="120" width="176" height="696" rx="6"/><rect class="box" x="520" y="120" width="176" height="696" rx="6"/><text class="name" x="608.0" y="441.5" text-anchor="middle">Problem detail</text><text class="sub mono" x="608.0" y="457.5" text-anchor="middle">RFC 9457 JSON</text><text class="sub mono" x="608.0" y="473.5" text-anchor="middle">SecurityProblemHandler</text><text class="sub mono" x="608.0" y="489.5" text-anchor="middle">GlobalExceptionHandler</text><text class="sub mono" x="608.0" y="505.5" text-anchor="middle">JSON over 1 MiB: 400</text></svg>
