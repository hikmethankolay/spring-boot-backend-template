<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" width="720" height="568" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">Spring Boot Backend Template architecture</title><desc id="architecture-desc">Clients call the Spring Boot app through its security filters; controllers hand requests to services, which use PostgreSQL and Redis and reach SMTP and GitHub or Google; Prometheus scrapes the app.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="zone" x="24" y="128" width="672" height="256" rx="8"/><path class="w-accent" d="M190,96 L190,168" marker-end="url(#a-accent)"/><path class="w dash" d="M540,96 L540,168" marker-end="url(#a)"/><path class="w" d="M328,204 L400,204" marker-end="url(#a)"/><path class="w" d="M540,248 L540,288" marker-end="url(#a)"/><path class="w" d="M102,360 L102,424" marker-end="url(#a)"/><path class="w" d="M274,360 L274,424" marker-end="url(#a)"/><path class="w dash" d="M446,360 L446,424" marker-end="url(#a)"/><path class="w" d="M618,360 L618,424" marker-end="url(#a)"/><line class="sep" x1="24" y1="536" x2="696" y2="536"/><rect class="mask-zone" x="33.0" y="137.2" width="97.8" height="9.4" rx="2"/><text class="tag mono" x="36" y="144" text-anchor="start">SPRING BOOT APP</text><rect class="mask" x="197.0" y="107.6" width="40.6" height="11.6" rx="2"/><text class="lbl mono" x="200" y="116" text-anchor="start">HTTPS</text><rect class="mask" x="547.0" y="107.6" width="47.6" height="11.6" rx="2"/><text class="lbl mono" x="550" y="116" text-anchor="start">SCRAPE</text><rect class="box" x="24" y="543" width="24" height="12" rx="2"/><text class="lbl mono" x="56" y="552">runs with the app</text><rect class="box-ext" x="201.81" y="543" width="24" height="12" rx="2"/><text class="lbl mono" x="233.81" y="552">external or optional</text><rect class="box-focal" x="400.40999999999997" y="543" width="24" height="12" rx="2"/><text class="lbl mono" x="432.40999999999997" y="552">entry point</text><line class="w dash" x1="536.64" y1="549" x2="560.64" y2="549"/><text class="lbl mono" x="568.64" y="552">asynchronous</text><rect class="mask" x="40" y="24" width="300" height="72" rx="6"/><rect class="box" x="40" y="24" width="300" height="72" rx="6"/><rect class="chip" x="48" y="32" width="47" height="12" rx="2"/><text class="tag mono" x="53" y="41.5">CLIENT</text><text class="name" x="190.0" y="67.5" text-anchor="middle">Browser, mobile app or service</text><text class="sub mono" x="190.0" y="83.5" text-anchor="middle">Bearer header or HttpOnly cookie</text><rect class="mask" x="400" y="24" width="280" height="72" rx="6"/><rect class="box-ext" x="400" y="24" width="280" height="72" rx="6"/><rect class="chip" x="408" y="32" width="71" height="12" rx="2"/><text class="tag mono" x="413" y="41.5">MONITORING</text><text class="name" x="540.0" y="67.5" text-anchor="middle">Prometheus and Grafana</text><text class="sub mono" x="540.0" y="83.5" text-anchor="middle">scrapes /actuator/prometheus</text><rect class="mask" x="48" y="168" width="280" height="72" rx="6"/><rect class="box-focal" x="48" y="168" width="280" height="72" rx="6"/><rect class="chip" x="56" y="176" width="53" height="12" rx="2"/><text class="tag mono" x="61" y="185.5">FILTERS</text><text class="name" x="188.0" y="211.5" text-anchor="middle">Security filters</text><text class="sub mono" x="188.0" y="227.5" text-anchor="middle">trace id · rate limit · CSRF · JWT</text><rect class="mask" x="400" y="168" width="272" height="80" rx="6"/><rect class="box" x="400" y="168" width="272" height="80" rx="6"/><rect class="chip" x="408" y="176" width="28" height="12" rx="2"/><text class="tag mono" x="413" y="185.5">WEB</text><text class="name" x="536.0" y="207.5" text-anchor="middle">REST controllers</text><text class="sub mono" x="536.0" y="223.5" text-anchor="middle">/api/v1 · /actuator</text><text class="sub mono" x="536.0" y="239.5" text-anchor="middle">/.well-known/jwks.json</text><rect class="mask" x="48" y="288" width="624" height="72" rx="6"/><rect class="box" x="48" y="288" width="624" height="72" rx="6"/><rect class="chip" x="56" y="296" width="47" height="12" rx="2"/><text class="tag mono" x="61" y="305.5">DOMAIN</text><text class="name" x="360.0" y="331.5" text-anchor="middle">Services and transactions</text><text class="sub mono" x="360.0" y="347.5" text-anchor="middle">auth · account · mfa · social · user · note · audit · mail outbox</text><rect class="mask" x="24" y="424" width="156" height="84" rx="6"/><rect class="box" x="24" y="424" width="156" height="84" rx="6"/><rect class="chip" x="32" y="432" width="41" height="12" rx="2"/><text class="tag mono" x="37" y="441.5">STORE</text><text class="name" x="102.0" y="473.5" text-anchor="middle">PostgreSQL 18</text><text class="sub mono" x="102.0" y="489.5" text-anchor="middle">Flyway schema</text><rect class="mask" x="196" y="424" width="156" height="84" rx="6"/><rect class="box" x="196" y="424" width="156" height="84" rx="6"/><rect class="chip" x="204" y="432" width="41" height="12" rx="2"/><text class="tag mono" x="209" y="441.5">STORE</text><text class="name" x="274.0" y="465.5" text-anchor="middle">Redis 8</text><text class="sub mono" x="274.0" y="481.5" text-anchor="middle">limits · revocation</text><text class="sub mono" x="274.0" y="497.5" text-anchor="middle">MFA · cache</text><rect class="mask" x="368" y="424" width="156" height="84" rx="6"/><rect class="box-ext" x="368" y="424" width="156" height="84" rx="6"/><rect class="chip" x="376" y="432" width="59" height="12" rx="2"/><text class="tag mono" x="381" y="441.5">EXTERNAL</text><text class="name" x="446.0" y="465.5" text-anchor="middle">SMTP server</text><text class="sub mono" x="446.0" y="481.5" text-anchor="middle">via the outbox</text><text class="sub mono" x="446.0" y="497.5" text-anchor="middle">Mailpit in dev</text><rect class="mask" x="540" y="424" width="156" height="84" rx="6"/><rect class="box-ext" x="540" y="424" width="156" height="84" rx="6"/><rect class="chip" x="548" y="432" width="59" height="12" rx="2"/><text class="tag mono" x="553" y="441.5">EXTERNAL</text><text class="name" x="618.0" y="465.5" text-anchor="middle">GitHub, Google</text><text class="sub mono" x="618.0" y="481.5" text-anchor="middle">OAuth 2 + PKCE</text><text class="sub mono" x="618.0" y="497.5" text-anchor="middle">optional</text></svg>
