<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="package-dependencies-title package-dependencies-desc"><title id="package-dependencies-title">Package dependencies</title><desc id="package-dependencies-desc">auth depends on account, social, mfa and the core of user, security, mail and token, which import each other; account, social and mfa depend on that core; webhook depends on the core and on mfa for its secret cipher; note depends on the core and on webhook; every package uses audit, common and config; only auth imports social.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#23262f;font-size:14px;font-weight:600}
.sub{fill:#555962;font-size:11.5px}
.lbl{fill:#555962;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#3d50f5;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#555962;font-size:8.5px;letter-spacing:.1em}
.note{fill:#555962;font-size:13px;font-style:italic}
.bg,.mask{fill:#ffffff} .mask-zone{fill:#f6f7f9}
.box{fill:#ffffff;stroke:#888c96;stroke-width:1}
.box-focal{fill:#eff1fe;stroke:#3d50f5;stroke-width:1.5}
.box-ext{fill:#ffffff;stroke:#888c96;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#f6f7f9;stroke:#c1c3c8;stroke-width:.8}
.frame{fill:none;stroke:#888c96;stroke-width:.8}
.chip{fill:none;stroke:#c1c3c8;stroke-width:.8}
.w{fill:none;stroke:#555962;stroke-width:1.2}
.w-accent{fill:none;stroke:#3d50f5;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#c1c3c8;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#c1c3c8;stroke-width:.8}
.m{fill:#555962} .m-accent{fill:#3d50f5} .m-open{fill:none;stroke:#555962;stroke-width:1.2}
.dot{fill:#23262f}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><path class="w" d="M194,140 L221,140 Q229,140 229,132 L229,76 Q229,68 237,68 L264,68" marker-end="url(#a)"/><path class="w-accent" d="M194,164 L264,164" marker-end="url(#a-accent)"/><path class="w" d="M194,212 L488,212" marker-end="url(#a)"/><path class="w-accent" d="M194,228 L232,228 Q240,228 240,236 L240,252 Q240,260 248,260 L264,260" marker-end="url(#a-accent)"/><path class="w" d="M440,68 L488,68" marker-end="url(#a)"/><path class="w" d="M440,164 L488,164" marker-end="url(#a)"/><path class="w" d="M440,260 L488,260" marker-end="url(#a)"/><path class="w" d="M352,328 L352,288" marker-end="url(#a)"/><path class="w" d="M440,356 L560,356 Q568,356 568,348 L568,288" marker-end="url(#a)"/><path class="w" d="M194,444 L292,444 Q300,444 300,436 L300,384" marker-end="url(#a)"/><path class="w" d="M194,460 L640,460 Q648,460 648,452 L648,288" marker-end="url(#a)"/><text class="note" x="360" y="604" text-anchor="middle">Only auth imports social. mfa is also used by webhook, whose signing secrets it encrypts.</text><rect class="mask" x="24" y="120" width="170" height="120" rx="6"/><rect class="box-focal" x="24" y="120" width="170" height="120" rx="6"/><text class="name" x="109.0" y="169.5" text-anchor="middle">auth</text><text class="sub mono" x="109.0" y="185.5" text-anchor="middle">login · tokens</text><text class="sub mono" x="109.0" y="201.5" text-anchor="middle">sessions</text><rect class="mask" x="24" y="416" width="170" height="56" rx="6"/><rect class="box" x="24" y="416" width="170" height="56" rx="6"/><text class="name" x="109.0" y="441.5" text-anchor="middle">note</text><text class="sub mono" x="109.0" y="457.5" text-anchor="middle">the sample feature</text><rect class="mask" x="264" y="40" width="176" height="56" rx="6"/><rect class="box" x="264" y="40" width="176" height="56" rx="6"/><text class="name" x="352.0" y="65.5" text-anchor="middle">account</text><text class="sub mono" x="352.0" y="81.5" text-anchor="middle">verify email · reset</text><rect class="mask" x="264" y="136" width="176" height="56" rx="6"/><rect class="box" x="264" y="136" width="176" height="56" rx="6"/><text class="name" x="352.0" y="161.5" text-anchor="middle">social</text><text class="sub mono" x="352.0" y="177.5" text-anchor="middle">GitHub and Google</text><rect class="mask" x="264" y="232" width="176" height="56" rx="6"/><rect class="box" x="264" y="232" width="176" height="56" rx="6"/><text class="name" x="352.0" y="257.5" text-anchor="middle">mfa</text><text class="sub mono" x="352.0" y="273.5" text-anchor="middle">authenticator codes</text><rect class="mask" x="264" y="328" width="176" height="56" rx="6"/><rect class="box" x="264" y="328" width="176" height="56" rx="6"/><text class="name" x="352.0" y="353.5" text-anchor="middle">webhook</text><text class="sub mono" x="352.0" y="369.5" text-anchor="middle">signed deliveries</text><rect class="mask" x="488" y="40" width="208" height="248" rx="6"/><rect class="box" x="488" y="40" width="208" height="248" rx="6"/><text class="name" x="592.0" y="121.5" text-anchor="middle">core</text><text class="sub mono" x="592.0" y="137.5" text-anchor="middle">user: users, roles</text><text class="sub mono" x="592.0" y="153.5" text-anchor="middle">security: JWT</text><text class="sub mono" x="592.0" y="169.5" text-anchor="middle">mail: outbox, alerts</text><text class="sub mono" x="592.0" y="185.5" text-anchor="middle">token: personal tokens</text><text class="sub mono" x="592.0" y="201.5" text-anchor="middle"></text><text class="sub mono" x="592.0" y="217.5" text-anchor="middle">they import each other</text><rect class="mask" x="24" y="512" width="672" height="60" rx="6"/><rect class="box" x="24" y="512" width="672" height="60" rx="6"/><rect class="chip" x="32" y="520" width="47" height="12" rx="2"/><text class="tag mono" x="37" y="529.5">SHARED</text><text class="name" x="360.0" y="549.5" text-anchor="middle">audit · common · config</text><text class="sub mono" x="360.0" y="565.5" text-anchor="middle">used by every package, so not drawn as arrows</text></svg>
