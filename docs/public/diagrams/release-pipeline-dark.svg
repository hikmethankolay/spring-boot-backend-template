<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 832" width="720" height="832" role="img" aria-labelledby="release-pipeline-title release-pipeline-desc"><title id="release-pipeline-title">Release pipeline</title><desc id="release-pipeline-desc">scripts/release.sh checks the repository, stamps the changelog and image tags, then commits, tags and pushes atomically; the tag runs the release workflow, which tests, builds, signs and publishes the image, then pins its digest and generates SLSA provenance, while an operator migrates and deploys.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="zone" x="40" y="24" width="640" height="232" rx="8"/><rect class="zone" x="40" y="296" width="640" height="344" rx="8"/><rect class="zone" x="40" y="672" width="640" height="136" rx="8"/><path class="w" d="M360,152 L360,184" marker-end="url(#a)"/><path class="w-accent" d="M240,224 L240,328" marker-end="url(#a-accent)"/><path class="w" d="M520,224 L520,264 Q520,272 528,272 L572,272 Q580,272 580,280 L580,328" marker-end="url(#a)"/><path class="w" d="M240,388 L240,420" marker-end="url(#a)"/><path class="w" d="M190,516 L190,556" marker-end="url(#a)"/><path class="w" d="M360,516 L360,528 Q360,536 368,536 L442,536 Q450,536 450,544 L450,556" marker-end="url(#a)"/><path class="w" d="M190,616 L190,712" marker-end="url(#a)"/><rect class="mask-zone" x="49.0" y="33.2" width="79.4" height="9.4" rx="2"/><text class="tag mono" x="52" y="40" text-anchor="start">YOUR MACHINE</text><rect class="mask-zone" x="49.0" y="305.2" width="165.1" height="9.4" rx="2"/><text class="tag mono" x="52" y="312" text-anchor="start">GITHUB ACTIONS, ON THE TAG</text><rect class="mask-zone" x="49.0" y="681.2" width="103.9" height="9.4" rx="2"/><text class="tag mono" x="52" y="688" text-anchor="start">CLUSTER, BY HAND</text><rect class="mask" x="247.0" y="271.6" width="82.2" height="11.6" rx="2"/><text class="lbl-accent mono" x="250" y="280" text-anchor="start">PUSH vX.Y.Z</text><rect class="mask" x="197.0" y="651.6" width="68.4" height="11.6" rx="2"/><text class="lbl mono" x="200" y="660" text-anchor="start">PULL MAIN</text><rect class="mask" x="120" y="56" width="480" height="96" rx="6"/><rect class="box" x="120" y="56" width="480" height="96" rx="6"/><rect class="chip" x="128" y="64" width="47" height="12" rx="2"/><text class="tag mono" x="133" y="73.5">SCRIPT</text><text class="name" x="360.0" y="95.5" text-anchor="middle">scripts/release.sh &lt;version&gt;</text><text class="sub mono" x="360.0" y="111.5" text-anchor="middle">checks: on main, clean, equal to origin/main,</text><text class="sub mono" x="360.0" y="127.5" text-anchor="middle">CHANGELOG notes; stamps the version and image</text><text class="sub mono" x="360.0" y="143.5" text-anchor="middle">tags, runs KubernetesManifestTest</text><rect class="mask" x="120" y="184" width="480" height="40" rx="6"/><rect class="box" x="120" y="184" width="480" height="40" rx="6"/><text class="name" x="360.0" y="209.5" text-anchor="middle">commit, tag, git push --atomic after a yes</text><rect class="mask" x="80" y="328" width="320" height="60" rx="6"/><rect class="box" x="80" y="328" width="320" height="60" rx="6"/><rect class="chip" x="88" y="336" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="345.5">JOB</text><text class="name" x="240.0" y="365.5" text-anchor="middle">test</text><text class="sub mono" x="240.0" y="381.5" text-anchor="middle">release.yml: ./mvnw verify</text><rect class="mask" x="480" y="328" width="180" height="60" rx="6"/><rect class="box" x="480" y="328" width="180" height="60" rx="6"/><rect class="chip" x="488" y="336" width="59" height="12" rx="2"/><text class="tag mono" x="493" y="345.5">WORKFLOW</text><text class="name" x="570.0" y="365.5" text-anchor="middle">pages.yml</text><text class="sub mono" x="570.0" y="381.5" text-anchor="middle">docs for the tag</text><rect class="mask" x="80" y="420" width="320" height="96" rx="6"/><rect class="box-focal" x="80" y="420" width="320" height="96" rx="6"/><rect class="chip" x="88" y="428" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="437.5">JOB</text><text class="name" x="240.0" y="459.5" text-anchor="middle">release</text><text class="sub mono" x="240.0" y="475.5" text-anchor="middle">amd64 + arm64 image, SBOM, provenance</text><text class="sub mono" x="240.0" y="491.5" text-anchor="middle">cosign sign and verify, signed SBOM</text><text class="sub mono" x="240.0" y="507.5" text-anchor="middle">GitHub release with notes</text><rect class="mask" x="80" y="556" width="220" height="60" rx="6"/><rect class="box" x="80" y="556" width="220" height="60" rx="6"/><rect class="chip" x="88" y="564" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="573.5">JOB</text><text class="name" x="190.0" y="593.5" text-anchor="middle">pin-digest</text><text class="sub mono" x="190.0" y="609.5" text-anchor="middle">digest → deploy/kubernetes</text><rect class="mask" x="340" y="556" width="220" height="60" rx="6"/><rect class="box" x="340" y="556" width="220" height="60" rx="6"/><rect class="chip" x="348" y="564" width="28" height="12" rx="2"/><text class="tag mono" x="353" y="573.5">JOB</text><text class="name" x="450.0" y="593.5" text-anchor="middle">provenance</text><text class="sub mono" x="450.0" y="609.5" text-anchor="middle">SLSA generator v2.1.0</text><rect class="mask" x="80" y="712" width="560" height="64" rx="6"/><rect class="box" x="80" y="712" width="560" height="64" rx="6"/><text class="name" x="360.0" y="733.5" text-anchor="middle">Migrate, then deploy</text><text class="sub mono" x="360.0" y="749.5" text-anchor="middle">kubectl apply -f migrate-job.yaml, wait for it</text><text class="sub mono" x="360.0" y="765.5" text-anchor="middle">kubectl apply -k deploy/kubernetes</text></svg>
