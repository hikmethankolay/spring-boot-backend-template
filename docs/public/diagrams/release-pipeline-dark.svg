<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1020" width="720" height="1020" role="img" aria-labelledby="release-pipeline-title release-pipeline-desc"><title id="release-pipeline-title">Release pipeline</title><desc id="release-pipeline-desc">scripts/release.sh checks the repository, stamps the changelog and image tags, commits, pushes main and starts the release workflow on main, which tests, builds and publishes the image, pins its digest and tags that commit; the run on the tag checks the pin, signs, creates the GitHub release, SLSA provenance and the docs site, while an operator migrates and deploys.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="zone" x="40" y="24" width="640" height="212" rx="8"/><rect class="zone" x="40" y="268" width="640" height="288" rx="8"/><rect class="zone" x="40" y="584" width="640" height="244" rx="8"/><rect class="zone" x="40" y="860" width="640" height="136" rx="8"/><path class="w" d="M360,152 L360,168" marker-end="url(#a)"/><path class="w-accent" d="M240,208 L240,296" marker-end="url(#a-accent)"/><path class="w" d="M240,356 L240,384" marker-end="url(#a)"/><path class="w" d="M240,444 L240,472" marker-end="url(#a)"/><path class="w-accent" d="M240,532 L240,612" marker-end="url(#a-accent)"/><path class="w" d="M400,502 L612,502 Q620,502 620,510 L620,900" marker-end="url(#a)"/><path class="w" d="M190,708 L190,748" marker-end="url(#a)"/><path class="w" d="M360,708 L360,720 Q360,728 368,728 L442,728 Q450,728 450,736 L450,748" marker-end="url(#a)"/><rect class="mask-zone" x="49.0" y="33.2" width="79.4" height="9.4" rx="2"/><text class="tag mono" x="52" y="40" text-anchor="start">YOUR MACHINE</text><rect class="mask-zone" x="49.0" y="277.2" width="146.8" height="9.4" rx="2"/><text class="tag mono" x="52" y="284" text-anchor="start">GITHUB ACTIONS, ON MAIN</text><rect class="mask-zone" x="49.0" y="593.2" width="165.1" height="9.4" rx="2"/><text class="tag mono" x="52" y="600" text-anchor="start">GITHUB ACTIONS, ON THE TAG</text><rect class="mask-zone" x="49.0" y="869.2" width="103.9" height="9.4" rx="2"/><text class="tag mono" x="52" y="876" text-anchor="start">CLUSTER, BY HAND</text><rect class="mask" x="247.0" y="243.6" width="186.2" height="11.6" rx="2"/><text class="lbl-accent mono" x="250" y="252" text-anchor="start">RUN ON MAIN, VERSION X.Y.Z</text><rect class="mask" x="247.0" y="563.6" width="151.5" height="11.6" rx="2"/><text class="lbl-accent mono" x="250" y="572" text-anchor="start">TAG vX.Y.Z, RUN ON IT</text><rect class="mask" x="627.0" y="831.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="630" y="840" text-anchor="start">PULL</text><rect class="mask" x="120" y="56" width="480" height="96" rx="6"/><rect class="box" x="120" y="56" width="480" height="96" rx="6"/><rect class="chip" x="128" y="64" width="47" height="12" rx="2"/><text class="tag mono" x="133" y="73.5">SCRIPT</text><text class="name" x="360.0" y="95.5" text-anchor="middle">scripts/release.sh &lt;version&gt;</text><text class="sub mono" x="360.0" y="111.5" text-anchor="middle">checks: on main, clean, equal to origin/main,</text><text class="sub mono" x="360.0" y="127.5" text-anchor="middle">CHANGELOG notes; stamps the version and image</text><text class="sub mono" x="360.0" y="143.5" text-anchor="middle">tags, runs KubernetesManifestTest</text><rect class="mask" x="120" y="168" width="480" height="40" rx="6"/><rect class="box" x="120" y="168" width="480" height="40" rx="6"/><text class="name" x="360.0" y="193.5" text-anchor="middle">commit; after a yes, push main and gh workflow run</text><rect class="mask" x="80" y="296" width="320" height="60" rx="6"/><rect class="box" x="80" y="296" width="320" height="60" rx="6"/><rect class="chip" x="88" y="304" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="313.5">JOB</text><text class="name" x="240.0" y="333.5" text-anchor="middle">test</text><text class="sub mono" x="240.0" y="349.5" text-anchor="middle">release.yml: ./mvnw verify</text><rect class="mask" x="80" y="384" width="320" height="60" rx="6"/><rect class="box" x="80" y="384" width="320" height="60" rx="6"/><rect class="chip" x="88" y="392" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="401.5">JOB</text><text class="name" x="240.0" y="421.5" text-anchor="middle">build</text><text class="sub mono" x="240.0" y="437.5" text-anchor="middle">amd64 + arm64 image, SBOM, provenance</text><rect class="mask" x="80" y="472" width="320" height="60" rx="6"/><rect class="box" x="80" y="472" width="320" height="60" rx="6"/><rect class="chip" x="88" y="480" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="489.5">JOB</text><text class="name" x="240.0" y="509.5" text-anchor="middle">pin-and-tag</text><text class="sub mono" x="240.0" y="525.5" text-anchor="middle">digest → deploy/kubernetes, tag it</text><rect class="mask" x="80" y="612" width="320" height="96" rx="6"/><rect class="box-focal" x="80" y="612" width="320" height="96" rx="6"/><rect class="chip" x="88" y="620" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="629.5">JOB</text><text class="name" x="240.0" y="651.5" text-anchor="middle">publish</text><text class="sub mono" x="240.0" y="667.5" text-anchor="middle">checks the tag pins the pushed image</text><text class="sub mono" x="240.0" y="683.5" text-anchor="middle">cosign sign and verify, signed SBOM</text><text class="sub mono" x="240.0" y="699.5" text-anchor="middle">GitHub release with notes</text><rect class="mask" x="80" y="748" width="220" height="56" rx="6"/><rect class="box" x="80" y="748" width="220" height="56" rx="6"/><rect class="chip" x="88" y="756" width="28" height="12" rx="2"/><text class="tag mono" x="93" y="765.5">JOB</text><text class="name" x="190.0" y="783.5" text-anchor="middle">provenance</text><text class="sub mono" x="190.0" y="799.5" text-anchor="middle">SLSA generator v2.1.0</text><rect class="mask" x="340" y="748" width="220" height="56" rx="6"/><rect class="box" x="340" y="748" width="220" height="56" rx="6"/><rect class="chip" x="348" y="756" width="59" height="12" rx="2"/><text class="tag mono" x="353" y="765.5">WORKFLOW</text><text class="name" x="450.0" y="783.5" text-anchor="middle">pages.yml</text><text class="sub mono" x="450.0" y="799.5" text-anchor="middle">docs for the tag</text><rect class="mask" x="80" y="900" width="560" height="64" rx="6"/><rect class="box" x="80" y="900" width="560" height="64" rx="6"/><text class="name" x="360.0" y="921.5" text-anchor="middle">Migrate, then deploy</text><text class="sub mono" x="360.0" y="937.5" text-anchor="middle">kubectl apply -f migrate-job.yaml, wait for it</text><text class="sub mono" x="360.0" y="953.5" text-anchor="middle">kubectl apply -k deploy/kubernetes</text></svg>
