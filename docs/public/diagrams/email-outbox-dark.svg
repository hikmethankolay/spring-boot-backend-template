<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 588" width="720" height="588" role="img" aria-labelledby="email-outbox-title email-outbox-desc"><title id="email-outbox-title">Transactional email outbox</title><desc id="email-outbox-desc">An email is stored in the same transaction as the change that triggers it, sent right after the commit, and retried by a scheduled dispatcher with backoff until it is sent or dropped.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="frame" x="200" y="356" width="512" height="132" rx="4"/><path class="frame" d="M200,372 H240 L246,366 V356"/><text class="tag mono" x="208" y="368">LOOP</text><line class="life" x1="96" y1="72" x2="96" y2="508"/><line class="life" x1="280" y1="72" x2="280" y2="508"/><line class="life" x1="464" y1="72" x2="464" y2="508"/><line class="life" x1="636" y1="72" x2="636" y2="508"/><path class="w" d="M96,108 L280,108" marker-end="url(#a)"/><path class="w" d="M280,144 L464,144" marker-end="url(#a)"/><path class="w-accent" d="M96,180 L464,180" marker-end="url(#a-accent)"/><path class="w" d="M280,216 L464,216" marker-end="url(#a)"/><path class="w" d="M280,252 L636,252" marker-end="url(#a)"/><path class="w dash" d="M636,288 L280,288" marker-end="url(#a)"/><path class="w" d="M280,324 L464,324" marker-end="url(#a)"/><path class="w" d="M280,396 L464,396" marker-end="url(#a)"/><path class="w" d="M280,432 L636,432" marker-end="url(#a)"/><path class="w" d="M280,468 L464,468" marker-end="url(#a)"/><rect class="mask" x="136.5" y="90.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="99" text-anchor="middle">enqueue(email)</text><rect class="mask" x="303.2" y="126.6" width="137.7" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="135" text-anchor="middle">INSERT email_outbox</text><rect class="mask" x="296.2" y="162.6" width="151.5" height="11.6" rx="2"/><text class="lbl-accent mono" x="372" y="171" text-anchor="middle">COMMIT change + email</text><rect class="mask" x="296.2" y="198.6" width="151.5" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="207" text-anchor="middle">lock row, SKIP LOCKED</text><rect class="mask" x="533.1" y="234.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="550" y="243" text-anchor="middle">send</text><rect class="mask" x="488.1" y="270.6" width="123.8" height="11.6" rx="2"/><text class="lbl mono" x="550" y="279" text-anchor="middle">accepted or error</text><rect class="mask" x="292.8" y="306.6" width="158.5" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="315" text-anchor="middle">DELETE, or retry later</text><rect class="mask" x="251" y="359" width="200.0" height="12" rx="2"/><text class="lbl mono" x="254" y="368">[every outbox-poll-interval]</text><rect class="mask" x="296.2" y="378.6" width="151.5" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="387" text-anchor="middle">lock due, SKIP LOCKED</text><rect class="mask" x="533.1" y="414.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="550" y="423" text-anchor="middle">send</text><rect class="mask" x="292.8" y="450.6" width="158.5" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="459" text-anchor="middle">delete, retry, or drop</text><text class="note" x="360" y="544" text-anchor="middle">Sent and dropped emails are deleted, so links with tokens do not linger in the database.</text><text class="note" x="360" y="568" text-anchor="middle">Retries wait retry-delay × 2ⁿ, at most an hour, until max-attempts; then the email is dropped.</text><rect class="mask" x="14.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="14.0" y="20" width="164" height="52" rx="6"/><text class="name" x="96.0" y="43.5" text-anchor="middle">AccountService</text><text class="sub mono" x="96.0" y="59.5" text-anchor="middle">@Transactional</text><rect class="mask" x="198.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="198.0" y="20" width="164" height="52" rx="6"/><text class="name" x="280.0" y="43.5" text-anchor="middle">EmailOutbox</text><text class="sub mono" x="280.0" y="59.5" text-anchor="middle">mail package</text><rect class="mask" x="382.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="382.0" y="20" width="164" height="52" rx="6"/><text class="name" x="464.0" y="43.5" text-anchor="middle">PostgreSQL</text><text class="sub mono" x="464.0" y="59.5" text-anchor="middle">email_outbox</text><rect class="mask" x="554.0" y="20" width="164" height="52" rx="6"/><rect class="box-ext" x="554.0" y="20" width="164" height="52" rx="6"/><text class="name" x="636.0" y="43.5" text-anchor="middle">SMTP server</text><text class="sub mono" x="636.0" y="59.5" text-anchor="middle">Mailpit in dev</text></svg>
