<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" width="720" height="612" role="img" aria-labelledby="social-login-title social-login-desc"><title id="social-login-title">Login with GitHub or Google</title><desc id="social-login-desc">The frontend sends the user to the provider with a PKCE challenge, receives the code on its redirect page and hands it with the verifier to the API, which exchanges it server-side and answers like a password login.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><line class="life" x1="110" y1="72" x2="110" y2="556"/><line class="life" x1="370" y1="72" x2="370" y2="556"/><line class="life" x1="610" y1="72" x2="610" y2="556"/><path class="w" d="M110,108 L370,108" marker-end="url(#a)"/><path class="w dash" d="M370,144 L110,144" marker-end="url(#a)"/><path class="w" d="M110,180 L130,180 Q138,180 138,188 L138,192 Q138,200 130,200 L112,200" marker-end="url(#a)"/><path class="w" d="M110,236 L610,236" marker-end="url(#a)"/><path class="w dash" d="M610,272 L110,272" marker-end="url(#a)"/><path class="w" d="M110,308 L130,308 Q138,308 138,316 L138,320 Q138,328 130,328 L112,328" marker-end="url(#a)"/><path class="w" d="M110,364 L370,364" marker-end="url(#a)"/><path class="w" d="M370,400 L610,400" marker-end="url(#a)"/><path class="w dash" d="M610,436 L370,436" marker-end="url(#a)"/><path class="w" d="M370,472 L390,472 Q398,472 398,480 L398,484 Q398,492 390,492 L372,492" marker-end="url(#a)"/><path class="w-accent" d="M370,528 L110,528" marker-end="url(#a-accent)"/><rect class="mask" x="146.9" y="90.6" width="186.2" height="11.6" rx="2"/><text class="lbl mono" x="240.0" y="99" text-anchor="middle">GET /auth/oauth2/providers</text><rect class="mask" x="136.5" y="126.6" width="207.0" height="11.6" rx="2"/><text class="lbl mono" x="240.0" y="135" text-anchor="middle">authorizationUri per provider</text><rect class="mask" x="145.0" y="184.6" width="186.2" height="11.6" rx="2"/><text class="lbl mono" x="148" y="193.0" text-anchor="start">keep state + code_verifier</text><rect class="mask" x="400.4" y="218.6" width="179.2" height="11.6" rx="2"/><text class="lbl mono" x="490" y="227" text-anchor="middle">redirect + code_challenge</text><rect class="mask" x="383.1" y="254.6" width="213.9" height="11.6" rx="2"/><text class="lbl mono" x="490" y="263" text-anchor="middle">OAUTH2_REDIRECT_URI?code&amp;state</text><rect class="mask" x="145.0" y="312.6" width="82.2" height="11.6" rx="2"/><text class="lbl mono" x="148" y="321.0" text-anchor="start">check state</text><rect class="mask" x="157.3" y="346.6" width="165.4" height="11.6" rx="2"/><text class="lbl mono" x="240.0" y="355" text-anchor="middle">POST /oauth2/{provider}</text><rect class="mask" x="403.8" y="382.6" width="172.3" height="11.6" rx="2"/><text class="lbl mono" x="490.0" y="391" text-anchor="middle">code + secret + verifier</text><rect class="mask" x="407.3" y="418.6" width="165.4" height="11.6" rx="2"/><text class="lbl mono" x="490.0" y="427" text-anchor="middle">profile, verified email</text><rect class="mask" x="405.0" y="476.6" width="165.4" height="11.6" rx="2"/><text class="lbl mono" x="408" y="485.0" text-anchor="start">link or create the user</text><rect class="mask" x="143.4" y="510.6" width="193.1" height="11.6" rx="2"/><text class="lbl-accent mono" x="240.0" y="519" text-anchor="middle">200 tokens, or 202 mfaToken</text><text class="note" x="360" y="592" text-anchor="middle">The client secret never leaves the server; a request without codeVerifier gets 400.</text><rect class="mask" x="10.0" y="20" width="200" height="52" rx="6"/><rect class="box" x="10.0" y="20" width="200" height="52" rx="6"/><text class="name" x="110.0" y="43.5" text-anchor="middle">Frontend</text><text class="sub mono" x="110.0" y="59.5" text-anchor="middle">browser, sessionStorage</text><rect class="mask" x="270.0" y="20" width="200" height="52" rx="6"/><rect class="box" x="270.0" y="20" width="200" height="52" rx="6"/><text class="name" x="370.0" y="43.5" text-anchor="middle">Spring Boot API</text><text class="sub mono" x="370.0" y="59.5" text-anchor="middle">AuthController</text><rect class="mask" x="510.0" y="20" width="200" height="52" rx="6"/><rect class="box-ext" x="510.0" y="20" width="200" height="52" rx="6"/><text class="name" x="610.0" y="43.5" text-anchor="middle">GitHub or Google</text><text class="sub mono" x="610.0" y="59.5" text-anchor="middle">OAuth 2 provider</text></svg>
