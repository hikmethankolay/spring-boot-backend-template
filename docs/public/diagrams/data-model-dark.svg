<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1116" width="720" height="1116" role="img" aria-labelledby="data-model-title data-model-desc"><title id="data-model-title">Database tables</title><desc id="data-model-desc">Nine tables belong to a user through user_id and are deleted with it, and webhook deliveries go with their endpoint; broadcasts keep their sender as a nullable reference; the email outbox and the append-only audit log have no foreign key to users.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="zone" x="14" y="790" width="692" height="286" rx="8"/><path class="w" d="M204,100 L252,100" marker-end="url(#a)"/><path class="w" d="M204,244 L210.0,244.0 Q216,244 216.0,238.0 L216,158 Q216,150 224,150 L252,150" marker-end="url(#a)"/><path class="w" d="M204,370 L220,370 Q228,370 228,362 L228,198 Q228,190 236,190 L252,190" marker-end="url(#a)"/><path class="w" d="M204,496 L232,496 Q240,496 240,488 L240.0,236.0 Q240,230 246.0,230.0 L252,230" marker-end="url(#a)"/><path class="w" d="M516,100 L468,100" marker-end="url(#a)"/><path class="w" d="M516,280 L510.0,280.0 Q504,280 504.0,274.0 L504,158 Q504,150 496,150 L468,150" marker-end="url(#a)"/><path class="w" d="M516,388 L500,388 Q492,388 492,380 L492,198 Q492,190 484,190 L468,190" marker-end="url(#a)"/><path class="w" d="M516,514 L488,514 Q480,514 480,506 L480.0,236.0 Q480,230 474.0,230.0 L468,230" marker-end="url(#a)"/><path class="w" d="M360,316 L360,292" marker-end="url(#a)"/><path class="w" d="M611,622 L611,598" marker-end="url(#a)"/><line class="sep" x1="24" y1="1084" x2="696" y2="1084"/><rect class="mask-zone" x="23.0" y="799.2" width="146.8" height="9.4" rx="2"/><text class="tag mono" x="26" y="806" text-anchor="start">NO FOREIGN KEY TO users</text><text class="note" x="360" y="1008" text-anchor="middle">audit_events refuses UPDATE, DELETE and TRUNCATE through a trigger;</text><text class="note" x="360" y="1028" text-anchor="middle">only purge_audit_events() removes rows older than 90 days, in batches.</text><text class="note" x="360" y="1048" text-anchor="middle">With no foreign key, the trail outlives a deleted user.</text><line class="w" x1="24" y1="1097" x2="48" y2="1097"/><text class="lbl mono" x="56" y="1100">foreign key, ON DELETE CASCADE</text><rect class="box-focal" x="291.9" y="1091" width="24" height="12" rx="2"/><text class="lbl mono" x="323.9" y="1100">parent of nine tables</text><rect class="mask" x="14" y="40" width="190" height="126" rx="6"/><rect class="box" x="14" y="40" width="190" height="126" rx="6"/><line class="sep" x1="14" y1="68" x2="204" y2="68"/><text class="name" x="24" y="59">account_tokens</text><text class="sub mono" x="24" y="86">id</text><text class="tag mono" x="194" y="86" text-anchor="end">PK</text><text class="sub mono" x="24" y="104">user_id</text><text class="tag mono" x="194" y="104" text-anchor="end">FK</text><text class="sub mono" x="24" y="122">type</text><text class="tag mono" x="194" y="122" text-anchor="end">3 PURPOSES</text><text class="sub mono" x="24" y="140">token_hash</text><text class="tag mono" x="194" y="140" text-anchor="end">UQ</text><text class="sub mono" x="24" y="158">expires_at</text><rect class="mask" x="14" y="184" width="190" height="108" rx="6"/><rect class="box" x="14" y="184" width="190" height="108" rx="6"/><line class="sep" x1="14" y1="212" x2="204" y2="212"/><text class="name" x="24" y="203">recovery_codes</text><text class="sub mono" x="24" y="230">id</text><text class="tag mono" x="194" y="230" text-anchor="end">PK</text><text class="sub mono" x="24" y="248">user_id</text><text class="tag mono" x="194" y="248" text-anchor="end">FK</text><text class="sub mono" x="24" y="266">code_hash</text><text class="tag mono" x="194" y="266" text-anchor="end">SHA-256</text><text class="sub mono" x="24" y="284">used_at</text><rect class="mask" x="14" y="310" width="190" height="108" rx="6"/><rect class="box" x="14" y="310" width="19