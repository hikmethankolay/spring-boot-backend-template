22" text-anchor="end">OPTIMISTIC</text><rect class="mask" x="516" y="40" width="190" height="162" rx="6"/><rect class="box" x="516" y="40" width="190" height="162" rx="6"/><line class="sep" x1="516" y1="68" x2="706" y2="68"/><text class="name" x="526" y="59">refresh_tokens</text><text class="sub mono" x="526" y="86">id</text><text class="tag mono" x="696" y="86" text-anchor="end">PK</text><text class="sub mono" x="526" y="104">user_id</text><text class="tag mono" x="696" y="104" text-anchor="end">FK</text><text class="sub mono" x="526" y="122">family_id</text><text class="tag mono" x="696" y="122" text-anchor="end">SESSION ID</text><text class="sub mono" x="526" y="140">token_hash</text><text class="tag mono" x="696" y="140" text-anchor="end">UQ</text><text class="sub mono" x="526" y="158">used_at</text><text class="tag mono" x="696" y="158" text-anchor="end">REUSE</text><text class="sub mono" x="526" y="176">session_version</text><text class="sub mono" x="526" y="194">session_started_at</text><rect class="mask" x="516" y="226" width="190" height="108" rx="6"/><rect class="box" x="516" y="226" width="190" height="108" rx="6"/><line class="sep" x1="516" y1="254" x2="706" y2="254"/><text class="name" x="526" y="245">social_identities</text><text class="sub mono" x="526" y="272">id</text><text class="tag mono" x="696" y="272" text-anchor="end">PK</text><text class="sub mono" x="526" y="290">user_id</text><text class="tag mono" x="696" y="290" text-anchor="end">FK</text><text class="sub mono" x="526" y="308">provider</text><text class="tag mono" x="696" y="308" text-anchor="end">UQ PAIR</text><text class="sub mono" x="526" y="326">subject</text><text class="tag mono" x="696" y="326" text-anchor="end">UQ PAIR</text><rect class="mask" x="252" y="40" width="216" height="198" rx="6"/><rect class="box-focal" x="252" y="40" width="216" height="198" rx="6"/><line class="sep" x1="252" y1="68" x2="468" y2="68"/><text class="name" x="262" y="59">users</text><text class="sub mono" x="262" y="86">id</text><text class="tag mono" x="458" y="86" text-anchor="end">PK</text><text class="sub mono" x="262" y="104">username, email</text><text class="tag mono" x="458" y="104" text-anchor="end">UQ</text><text class="sub mono" x="262" y="122">password_hash</text><text class="sub mono" x="262" y="140">role</text><text class="tag mono" x="458" y="140" text-anchor="end">USER·ADMIN·OWNER</text><text class="sub mono" x="262" y="158">email_verified</text><text class="sub mono" x="262" y="176">session_version</text><text class="sub mono" x="262" y="194">totp_secret</text><text class="tag mono" x="458" y="194" text-anchor="end">AES-GCM</text><text class="sub mono" x="262" y="212">totp_enabled</text><text class="sub mono" x="262" y="230">totp_last_step</text><rect class="mask" x="34" y="496" width="310" height="126" rx="6"/><rect class="box" x="34" y="496" width="310" height="126" rx="6"/><line class="sep" x1="34" y1="524" x2="344" y2="524"/><text class="name" x="44" y="515">email_outbox</text><text class="sub mono" x="44" y="542">id</text><text class="tag mono" x="334" y="542" text-anchor="end">PK</text><text class="sub mono" x="44" y="560">recipient, subject</text><text class="sub mono" x="44" y="578">body, html_body</text><text class="tag mono" x="334" y="578" text-anchor="end">HTML OPTIONAL</text><text class="sub mono" x="44" y="596">attempts, next_attempt_at</text><text class="tag mono" x="334" y="596" text-anchor="end">INDEX</text><text class="sub mono" x="44" y="614">last_error</text><rect class="mask" x="376" y="496" width="310" height="126" rx="6"/><rect class="box" x="376" y="496" width="310" height="126" rx="6"/><line class="sep" x1="376" y1="524" x2="686" y2="524"/><text class="name" x="386" y="515">audit_events</text><text class="tag mono" x="676" y="514" text-anchor="end">APPEND-ONLY</text><text class="sub mono" x="386" y="542">id</text><text class="tag mono" x="676" y="542" text-anchor="end">PK</text><text class="sub mono" x="386" y="560">occurred_at, action</text><text class="sub mono" x="386" y="578">user_id</text><text class="tag mono" x="676" y="578" text-anchor="end">NO FK</text><text class="sub mono" x="386" y="596">actor_id, client_ip</text><text class="sub mono" x="386" y="614">details</text><text class="tag mono" x="676" y="614" text-anchor="end">JSONB</text></svg>
