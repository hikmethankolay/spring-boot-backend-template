<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-labelledby="session-lifetime-title session-lifetime-desc"><title id="session-lifetime-title">How long a session lasts</title><desc id="session-lifetime-desc">Each refresh restarts a one-day idle limit, so a session that stops refreshing ends a day later, but no session lasts more than seven days after login, however often it refreshes.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#23262f;font-size:14px;font-weight:600}
.sub{fill:#555962;font-size:11.5px}
.lbl{fill:#555962;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#3d50f5;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#555962;font-size:8.5px;letter-spacing:.1em}
.note{fill:#555962;font-size:13px;font-style:italic}
.bg,.mask{fill:#ffffff} .mask-zone{fill:#f6f7f9}
.box{fill:#ffffff;stroke:#888c96;stroke-width:1}
.box-focal{fill:#eff1fe;stroke:#3d50f5;stroke-width:1.5}
.box-ext{fill:#ffffff;stroke:#888c96;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#f6f7f9;stroke:#c1c3c8;stroke-width:.8}
.frame{fill:none;stroke:#888c96;stroke-width:.8}
.chip{fill:none;stroke:#c1c3c8;stroke-width:.8}
.w{fill:none;stroke:#555962;stroke-width:1.2}
.w-accent{fill:none;stroke:#3d50f5;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#c1c3c8;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#c1c3c8;stroke-width:.8}
.m{fill:#555962} .m-accent{fill:#3d50f5} .m-open{fill:none;stroke:#555962;stroke-width:1.2}
.dot{fill:#23262f}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><line class="sep" x1="40" y1="256" x2="664.0" y2="256"/><line class="sep" x1="40" y1="252" x2="40" y2="260"/><line class="sep" x1="120" y1="252" x2="120" y2="260"/><line class="sep" x1="200" y1="252" x2="200" y2="260"/><line class="sep" x1="280" y1="252" x2="280" y2="260"/><line class="sep" x1="360" y1="252" x2="360" y2="260"/><line class="sep" x1="440" y1="252" x2="440" y2="260"/><line class="sep" x1="520" y1="252" x2="520" y2="260"/><line class="sep" x1="600" y1="252" x2="600" y2="260"/><line class="w-accent" x1="600" y1="52" x2="600" y2="248"/><line class="w" x1="200.0" y1="106" x2="280.0" y2="106"/><rect class="mask" x="19.7" y="267.6" width="40.6" height="11.6" rx="2"/><text class="lbl mono" x="40" y="276" text-anchor="middle">LOGIN</text><rect class="mask" x="106.6" y="267.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="120" y="276" text-anchor="middle">1 d</text><rect class="mask" x="186.6" y="267.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="200" y="276" text-anchor="middle">2 d</text><rect class="mask" x="266.6" y="267.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="280" y="276" text-anchor="middle">3 d</text><rect class="mask" x="346.6" y="267.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="360" y="276" text-anchor="middle">4 d</text><rect class="mask" x="426.6" y="267.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="440" y="276" text-anchor="middle">5 d</text><rect class="mask" x="506.6" y="267.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="520" y="276" text-anchor="middle">6 d</text><rect class="mask" x="586.6" y="267.6" width="26.8" height="11.6" rx="2"/><text class="lbl mono" x="600" y="276" text-anchor="middle">7 d</text><rect class="mask" x="545.0" y="31.6" width="110.0" height="11.6" rx="2"/><text class="lbl-accent mono" x="600" y="40" text-anchor="middle">MAX SESSION 7 d</text><text class="name" x="40" y="84">Stops refreshing</text><text class="sub mono" x="40" y="100">idle limit ends it</text><rect class="mask" x="209.3" y="88.6" width="61.4" height="11.6" rx="2"/><text class="lbl mono" x="240.0" y="97" text-anchor="middle">1 d IDLE</text><rect class="mask" x="287.0" y="119.6" width="33.7" height="11.6" rx="2"/><text class="lbl mono" x="290.0" y="128" text-anchor="start">ENDS</text><text class="name" x="40" y="172">Refreshes all week</text><text class="sub mono" x="40" y="188">absolute cap ends it</text><rect class="mask" x="610.7" y="187.6" width="54.5" height="11.6" rx="2"/><text class="lbl mono" x="638.0" y="196" text-anchor="middle">CUT OFF</text><text class="note" x="360" y="304" text-anchor="middle">Every refresh issues a new 15-minute access JWT, and the new refresh token</text><text class="note" x="360" y="324" text-anchor="middle">never outlives the cap. Remember-me: 30 days idle, at most 90 days.</text><text class="note" x="360" y="344" text-anchor="middle">Hitting the cap audits auth.session_expired_absolute.</text><rect class="box" x="40" y="117" width="240.0" height="14" rx="3"/><circle class="dot" cx="40" cy="124" r="5"/><circle class="dot" cx="80.0" cy="124" r="3"/><circle class="dot" cx="136.0" cy="124" r="3"/><circle class="dot" cx="200.0" cy="124" r="3"/><rect class="box" x="40" y="205" width="560.0" height="14" rx="3"/><circle class="dot" cx="40" cy="212" r="5"/><circle class="dot" cx="96.0" cy="212" r="3"/><circle class="dot" cx="160.0" cy="212" r="3"/><circle class="dot" cx="216.0" cy="212" r="3"/><circle class="dot" cx="280.0" cy="212" r="3"/><circle class="dot" cx="344.0" cy="212" r="3"/><circle class="dot" cx="408.0" cy="212" r="3"/><circle class="dot" cx="464.0" cy="212" r="3"/><circle class="dot" cx="528.0" cy="212" r="3"/><circle class="dot" cx="584.0" cy="212" r="3"/><rect class="box-ext" x="604.0" y="205" width="60.0" height="14" rx="3"/></svg>
