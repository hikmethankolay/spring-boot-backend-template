<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 684" width="720" height="684" role="img" aria-labelledby="sign-up-title sign-up-desc"><title id="sign-up-title">Email-first sign-up</title><desc id="sign-up-desc">Registering only emails the address, a sign-up link or a notice that it has an account, with the same 202 answer either way; the link&#x27;s page completes the sign-up once and creates a verified user.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#23262f;font-size:14px;font-weight:600}
.sub{fill:#555962;font-size:11.5px}
.lbl{fill:#555962;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#3d50f5;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#555962;font-size:8.5px;letter-spacing:.1em}
.note{fill:#555962;font-size:13px;font-style:italic}
.bg,.mask{fill:#ffffff} .mask-zone{fill:#f6f7f9}
.box{fill:#ffffff;stroke:#888c96;stroke-width:1}
.box-focal{fill:#eff1fe;stroke:#3d50f5;stroke-width:1.5}
.box-ext{fill:#ffffff;stroke:#888c96;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#f6f7f9;stroke:#c1c3c8;stroke-width:.8}
.frame{fill:none;stroke:#888c96;stroke-width:.8}
.chip{fill:none;stroke:#c1c3c8;stroke-width:.8}
.w{fill:none;stroke:#555962;stroke-width:1.2}
.w-accent{fill:none;stroke:#3d50f5;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#c1c3c8;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#c1c3c8;stroke-width:.8}
.m{fill:#555962} .m-accent{fill:#3d50f5} .m-open{fill:none;stroke:#555962;stroke-width:1.2}
.dot{fill:#23262f}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="frame" x="24" y="200" width="688" height="112" rx="4"/><path class="frame" d="M24,216 H64 L70,210 V200"/><text class="tag mono" x="32" y="212">ALT</text><line class="life" x1="72" y1="72" x2="72" y2="600"/><line class="life" x1="216" y1="72" x2="216" y2="600"/><line class="life" x1="360" y1="72" x2="360" y2="600"/><line class="life" x1="504" y1="72" x2="504" y2="600"/><line class="life" x1="648" y1="72" x2="648" y2="600"/><path class="w" d="M72,108 L216,108" marker-end="url(#a)"/><path class="w" d="M216,144 L360,144" marker-end="url(#a)"/><path class="w" d="M216,180 L504,180" marker-end="url(#a)"/><path class="w" d="M216,240 L648,240" marker-end="url(#a)"/><line class="life" x1="32" y1="256" x2="704" y2="256"/><path class="w" d="M216,296 L648,296" marker-end="url(#a)"/><path class="w dash" d="M216,340 L72,340" marker-end="url(#a)"/><path class="w dash" d="M648,376 L72,376" marker-end="url(#a-open)"/><path class="w" d="M72,424 L216,424" marker-end="url(#a)"/><path class="w" d="M216,460 L360,460" marker-end="url(#a)"/><path class="w" d="M216,496 L504,496" marker-end="url(#a)"/><path class="w" d="M216,532 L360,532" marker-end="url(#a)"/><path class="w-accent" d="M216,568 L72,568" marker-end="url(#a-accent)"/><rect class="mask" x="92.5" y="90.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="144.0" y="99" text-anchor="middle">POST /register</text><rect class="mask" x="236.5" y="126.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="288.0" y="135" text-anchor="middle">claim cooldown</text><rect class="mask" x="397.8" y="162.6" width="68.4" height="11.6" rx="2"/><text class="lbl mono" x="432" y="171" text-anchor="middle">find user</text><rect class="mask" x="75" y="203" width="172.3" height="12" rx="2"/><text class="lbl mono" x="78" y="212">[address has an account]</text><rect class="mask" x="510.6" y="222.6" width="130.7" height="11.6" rx="2"/><text class="lbl mono" x="576" y="231" text-anchor="middle">already-registered</text><rect class="mask" x="81.0" y="263.6" width="47.6" height="11.6" rx="2"/><text class="lbl mono" x="84" y="272" text-anchor="start">[else]</text><rect class="mask" x="531.4" y="278.6" width="89.2" height="11.6" rx="2"/><text class="lbl mono" x="576" y="287" text-anchor="middle">sign-up link</text><rect class="mask" x="92.5" y="322.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="144.0" y="331" text-anchor="middle">202 either way</text><rect class="mask" x="92.5" y="358.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="144" y="367" text-anchor="middle">/sign-up?token</text><rect class="mask" x="82.1" y="406.6" width="123.8" height="11.6" rx="2"/><text class="lbl mono" x="144.0" y="415" text-anchor="middle">register/complete</text><rect class="mask" x="243.4" y="442.6" width="89.2" height="11.6" rx="2"/><text class="lbl mono" x="288.0" y="451" text-anchor="middle">link unused?</text><rect class="mask" x="390.9" y="478.6" width="82.2" height="11.6" rx="2"/><text class="lbl mono" x="432" y="487" text-anchor="middle">INSERT user</text><rect class="mask" x="236.5" y="514.6" width="103.0" height="11.6" rx="2"/><text class="lbl mono" x="288.0" y="523" text-anchor="middle">mark link used</text><rect class="mask" x="92.5" y="550.6" width="103.0" height="11.6" rx="2"/><text class="lbl-accent mono" x="144.0" y="559" text-anchor="middle">201 + Location</text><text class="note" x="360" y="628" text-anchor="middle">The same 202 and at most one email per cooldown either way, so the form</text><text class="note" x="360" y="646" text-anchor="middle">does not reveal who has an account.</text><text class="note" x="360" y="670" text-anchor="middle">A link works once: used again it gets 400 invalid-token.</text><rect class="mask" x="8.0" y="20" width="128" height="52" rx="6"/><rect class="box" x="8.0" y="20" width="128" height="52" rx="6"/><text class="name" x="72.0" y="43.5" text-anchor="middle">Frontend</text><text class="sub mono" x="72.0" y="59.5" text-anchor="middle">browser</text><rect class="mask" x="152.0" y="20" width="128" height="52" rx="6"/><rect class="box" x="152.0" y="20" width="128" height="52" rx="6"/><text class="name" x="216.0" y="43.5" text-anchor="middle">API</text><text class="sub mono" x="216.0" y="59.5" text-anchor="middle">AccountService</text><rect class="mask" x="296.0" y="20" width="128" height="52" rx="6"/><rect class="box" x="296.0" y="20" width="128" height="52" rx="6"/><text class="name" x="360.0" y="43.5" text-anchor="middle">Redis</text><text class="sub mono" x="360.0" y="59.5" text-anchor="middle">cooldown, links</text><rect class="mask" x="440.0" y="20" width="128" height="52" rx="6"/><rect class="box" x="440.0" y="20" width="128" height="52" rx="6"/><text class="name" x="504.0" y="43.5" text-anchor="middle">PostgreSQL</text><text class="sub mono" x="504.0" y="59.5" text-anchor="middle">users</text><rect class="mask" x="584.0" y="20" width="128" height="52" rx="6"/><rect class="box-ext" x="584.0" y="20" width="128" height="52" rx="6"/><text class="name" x="648.0" y="43.5" text-anchor="middle">Email</text><text class="sub mono" x="648.0" y="59.5" text-anchor="middle">outbox, SMTP</text></svg>
