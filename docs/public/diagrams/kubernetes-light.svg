<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" width="720" height="584" role="img" aria-labelledby="kubernetes-title kubernetes-desc"><title id="kubernetes-title">Kubernetes deployment</title><desc id="kubernetes-desc">In namespace backend, ingress-nginx reaches the app pods through Service app and Prometheus scrapes their management port; secrets are mounted as files, a migrate Job runs Flyway as the schema owner, and the NetworkPolicy lets the pods reach only DNS, PostgreSQL, Redis, SMTP and HTTPS.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#23262f;font-size:14px;font-weight:600}
.sub{fill:#555962;font-size:11.5px}
.lbl{fill:#555962;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#3d50f5;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#555962;font-size:8.5px;letter-spacing:.1em}
.note{fill:#555962;font-size:13px;font-style:italic}
.bg,.mask{fill:#ffffff} .mask-zone{fill:#f6f7f9}
.box{fill:#ffffff;stroke:#888c96;stroke-width:1}
.box-focal{fill:#eff1fe;stroke:#3d50f5;stroke-width:1.5}
.box-ext{fill:#ffffff;stroke:#888c96;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#f6f7f9;stroke:#c1c3c8;stroke-width:.8}
.frame{fill:none;stroke:#888c96;stroke-width:.8}
.chip{fill:none;stroke:#c1c3c8;stroke-width:.8}
.w{fill:none;stroke:#555962;stroke-width:1.2}
.w-accent{fill:none;stroke:#3d50f5;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#c1c3c8;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#c1c3c8;stroke-width:.8}
.m{fill:#555962} .m-accent{fill:#3d50f5} .m-open{fill:none;stroke:#555962;stroke-width:1.2}
.dot{fill:#23262f}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="zone" x="24" y="116" width="672" height="272" rx="8"/><rect class="zone" x="24" y="420" width="672" height="104" rx="8"/><path class="w" d="M170,84 L170,156" marker-end="url(#a)"/><path class="w-accent" d="M170,216 L170,264" marker-end="url(#a-accent)"/><path class="w dash" d="M330,84 L330,264" marker-end="url(#a)"/><path class="w dash" d="M470,186 L388,186 Q380,186 380,194 L380,264" marker-end="url(#a)"/><path class="w dash" d="M570,216 L570,264" marker-end="url(#a)"/><path class="w" d="M200,376 L200,460" marker-end="url(#a)"/><path class="w" d="M390,376 L390,460" marker-end="url(#a)"/><path class="w" d="M410,360 L552,360 Q560,360 560,368 L560,460" marker-end="url(#a)"/><path class="w" d="M620,336 L620,460" marker-end="url(#a)"/><line class="sep" x1="24" y1="548" x2="696" y2="548"/><rect class="mask-zone" x="33.0" y="125.2" width="110.0" height="9.4" rx="2"/><text class="tag mono" x="36" y="132" text-anchor="start">NAMESPACE BACKEND</text><rect class="mask-zone" x="33.0" y="429.2" width="128.4" height="9.4" rx="2"/><text class="tag mono" x="36" y="436" text-anchor="start">NETWORKPOLICY EGRESS</text><rect class="mask-zone" x="177.0" y="235.6" width="68.4" height="11.6" rx="2"/><text class="lbl mono" x="180" y="244" text-anchor="start">PORT 8080</text><rect class="mask-zone" x="254.6" y="131.6" width="68.4" height="11.6" rx="2"/><text class="lbl mono" x="320" y="140" text-anchor="end">PORT 8081</text><rect class="mask-zone" x="404.7" y="168.6" width="40.6" height="11.6" rx="2"/><text class="lbl mono" x="425" y="177" text-anchor="middle">MOUNT</text><rect class="mask-zone" x="577.0" y="235.6" width="40.6" height="11.6" rx="2"/><text class="lbl mono" x="580" y="244" text-anchor="start">MOUNT</text><rect class="box-ext" x="24" y="555" width="24" height="12" rx="2"/><text class="lbl mono" x="56" y="564">outside the namespace</text><rect class="box-focal" x="229.53" y="555" width="24" height="12" rx="2"/><text class="lbl mono" x="261.53" y="564">serves the API</text><line class="w dash" x1="386.55" y1="561" x2="410.55" y2="561"/><text class="lbl mono" x="418.55" y="564">scrape or volume mount</text><rect class="mask" x="60" y="24" width="220" height="60" rx="6"/><rect class="box-ext" x="60" y="24" width="220" height="60" rx="6"/><rect class="chip" x="68" y="32" width="65" height="12" rx="2"/><text class="tag mono" x="73" y="41.5">NAMESPACE</text><text class="name" x="170.0" y="61.5" text-anchor="middle">ingress-nginx</text><text class="sub mono" x="170.0" y="77.5" text-anchor="middle">the only source of traffic</text><rect class="mask" x="300" y="24" width="200" height="60" rx="6"/><rect class="box-ext" x="300" y="24" width="200" height="60" rx="6"/><rect class="chip" x="308" y="32" width="71" height="12" rx="2"/><text class="tag mono" x="313" y="41.5">MONITORING</text><text class="name" x="400.0" y="61.5" text-anchor="middle">Prometheus</text><text class="sub mono" x="400.0" y="77.5" text-anchor="middle">/actuator/prometheus</text><rect class="mask" x="70" y="156" width="200" height="60" rx="6"/><rect class="box" x="70" y="156" width="200" height="60" rx="6"/><rect class="chip" x="78" y="164" width="53" height="12" rx="2"/><text class="tag mono" x="83" y="173.5">SERVICE</text><text class="name" x="170.0" y="193.5" text-anchor="middle">Service app</text><text class="sub mono" x="170.0" y="209.5" text-anchor="middle">:80 → port http</text><rect class="mask" x="470" y="156" width="200" height="60" rx="6"/><rect class="box" x="470" y="156" width="200" height="60" rx="6"/><rect class="chip" x="478" y="164" width="47" height="12" rx="2"/><text class="tag mono" x="483" y="173.5">SECRET</text><text class="name" x="570.0" y="193.5" text-anchor="middle">Secrets as files</text><text class="sub mono" x="570.0" y="209.5" text-anchor="middle">/etc/app/secrets</text><rect class="mask" x="50" y="264" width="360" height="112" rx="6"/><rect class="box-focal" x="50" y="264" width="360" height="112" rx="6"/><rect class="chip" x="58" y="272" width="71" height="12" rx="2"/><text class="tag mono" x="63" y="281.5">DEPLOYMENT</text><text class="name" x="230.0" y="303.5" text-anchor="middle">App pods, database role app</text><text class="sub mono" x="230.0" y="319.5" text-anchor="middle">2 replicas · HPA 2–6 at 70% CPU</text><text class="sub mono" x="230.0" y="335.5" text-anchor="middle">PDB minAvailable 1</text><text class="sub mono" x="230.0" y="351.5" text-anchor="middle">rolling update: maxUnavailable 0, maxSurge 1</text><text class="sub mono" x="230.0" y="367.5" text-anchor="middle">probes /actuator/health/{liveness,readiness}</text><rect class="mask" x="470" y="264" width="200" height="72" rx="6"/><rect class="box" x="470" y="264" width="200" height="72" rx="6"/><rect class="chip" x="478" y="272" width="28" height="12" rx="2"/><text class="tag mono" x="483" y="281.5">JOB</text><text class="name" x="570.0" y="299.5" text-anchor="middle">migrate</text><text class="sub mono" x="570.0" y="315.5" text-anchor="middle">Flyway as app_owner</text><text class="sub mono" x="570.0" y="331.5" text-anchor="middle">app-migrator-secrets</text><rect class="mask" x="115" y="460" width="170" height="56" rx="6"/><rect class="box-ext" x="115" y="460" width="170" height="56" rx="6"/><text class="name" x="200.0" y="485.5" text-anchor="middle">Redis</text><text class="sub mono" x="200.0" y="501.5" text-anchor="middle">:6379</text><rect class="mask" x="305" y="460" width="170" height="56" rx="6"/><rect class="box-ext" x="305" y="460" width="170" height="56" rx="6"/><text class="name" x="390.0" y="485.5" text-anchor="middle">SMTP and HTTPS</text><text class="sub mono" x="390.0" y="501.5" text-anchor="middle">:587, :465 · :443</text><rect class="mask" x="500" y="460" width="170" height="56" rx="6"/><rect class="box-ext" x="500" y="460" width="170" height="56" rx="6"/><text class="name" x="585.0" y="485.5" text-anchor="middle">PostgreSQL</text><text class="sub mono" x="585.0" y="501.5" text-anchor="middle">:5432</text></svg>
