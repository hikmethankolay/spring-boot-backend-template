<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 628" width="720" height="628" role="img" aria-labelledby="auth-sequence-title auth-sequence-desc"><title id="auth-sequence-title">Login, two-factor step and refresh</title><desc id="auth-sequence-desc">The client logs in with a password, answers the two-factor challenge if it is on, receives an access JWT and a refresh token, and later exchanges the refresh token once for a new pair.</desc><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
.name{fill:#ffffff;font-size:14px;font-weight:600}
.sub{fill:#a3a6ae;font-size:11.5px}
.lbl{fill:#a3a6ae;font-size:10.5px;letter-spacing:.04em}
.lbl-accent{fill:#b2c7ff;font-size:10.5px;letter-spacing:.04em}
.tag{fill:#a3a6ae;font-size:8.5px;letter-spacing:.1em}
.note{fill:#a3a6ae;font-size:13px;font-style:italic}
.bg,.mask{fill:#17181c} .mask-zone{fill:#23262f}
.box{fill:#17181c;stroke:#6b6f79;stroke-width:1}
.box-focal{fill:#1b233c;stroke:#3369ff;stroke-width:1.5}
.box-ext{fill:#17181c;stroke:#6b6f79;stroke-width:1;stroke-dasharray:4 3}
.zone{fill:#23262f;stroke:#40434d;stroke-width:.8}
.frame{fill:none;stroke:#6b6f79;stroke-width:.8}
.chip{fill:none;stroke:#40434d;stroke-width:.8}
.w{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.w-accent{fill:none;stroke:#3369ff;stroke-width:1.6}
.dash{stroke-dasharray:5 4}
.life{stroke:#40434d;stroke-width:1;stroke-dasharray:3 3}
.sep{stroke:#40434d;stroke-width:.8}
.m{fill:#a3a6ae} .m-accent{fill:#3369ff} .m-open{fill:none;stroke:#a3a6ae;stroke-width:1.2}
.dot{fill:#ffffff}
</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon class="m-accent" points="0 0, 10 3.5, 0 7"/></marker><marker id="a-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polyline class="m-open" points="0 0, 10 3.5, 0 7"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="frame" x="24" y="164" width="688" height="160" rx="4"/><path class="frame" d="M24,180 H64 L70,174 V164"/><text class="tag mono" x="32" y="176">OPT</text><line class="life" x1="96" y1="72" x2="96" y2="576"/><line class="life" x1="280" y1="72" x2="280" y2="576"/><line class="life" x1="464" y1="72" x2="464" y2="576"/><line class="life" x1="636" y1="72" x2="636" y2="576"/><path class="w" d="M96,108 L280,108" marker-end="url(#a)"/><path class="w" d="M280,144 L464,144" marker-end="url(#a)"/><path class="w" d="M280,200 L636,200" marker-end="url(#a)"/><path class="w dash" d="M280,236 L96,236" marker-end="url(#a)"/><path class="w" d="M96,272 L280,272" marker-end="url(#a)"/><path class="w" d="M280,308 L636,308" marker-end="url(#a)"/><path class="w" d="M280,360 L464,360" marker-end="url(#a)"/><path class="w-accent" d="M280,396 L96,396" marker-end="url(#a-accent)"/><line class="sep" x1="24" y1="436" x2="301.095" y2="436"/><line class="sep" x1="442.905" y1="436" x2="696" y2="436"/><path class="w" d="M96,476 L280,476" marker-end="url(#a)"/><path class="w" d="M280,512 L464,512" marker-end="url(#a)"/><path class="w dash" d="M280,548 L96,548" marker-end="url(#a)"/><rect class="mask" x="129.6" y="90.6" width="116.9" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="99" text-anchor="middle">POST /auth/login</text><rect class="mask" x="303.2" y="126.6" width="137.7" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="135" text-anchor="middle">check password hash</text><rect class="mask" x="75" y="167" width="234.7" height="12" rx="2"/><text class="lbl mono" x="78" y="176">[two-factor authentication is on]</text><rect class="mask" x="495.0" y="182.6" width="110.0" height="11.6" rx="2"/><text class="lbl mono" x="550" y="191" text-anchor="middle">store challenge</text><rect class="mask" x="140.0" y="218.6" width="96.1" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="227" text-anchor="middle">202  mfaToken</text><rect class="mask" x="133.0" y="254.6" width="110.0" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="263" text-anchor="middle">POST /login/mfa</text><rect class="mask" x="488.1" y="290.6" width="123.8" height="11.6" rx="2"/><text class="lbl mono" x="550" y="299" text-anchor="middle">consume challenge</text><rect class="mask" x="289.3" y="342.6" width="165.4" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="351" text-anchor="middle">save refresh-token hash</text><rect class="mask" x="112.2" y="378.6" width="151.5" height="11.6" rx="2"/><text class="lbl-accent mono" x="188.0" y="387" text-anchor="middle">200  access + refresh</text><rect class="mask" x="310.1" y="430.6" width="123.8" height="11.6" rx="2"/><text class="lbl mono" x="372" y="439" text-anchor="middle">15 MIN LATER: 401</text><rect class="mask" x="122.6" y="458.6" width="130.7" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="467" text-anchor="middle">POST /auth/refresh</text><rect class="mask" x="299.7" y="494.6" width="144.6" height="11.6" rx="2"/><text class="lbl mono" x="372.0" y="503" text-anchor="middle">mark used, new token</text><rect class="mask" x="140.0" y="530.6" width="96.1" height="11.6" rx="2"/><text class="lbl mono" x="188.0" y="539" text-anchor="middle">200  new pair</text><text class="note" x="360" y="608" text-anchor="middle">Each refresh token works once: presenting a used one again revokes the whole session.</text><rect class="mask" x="14.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="14.0" y="20" width="164" height="52" rx="6"/><text class="name" x="96.0" y="43.5" text-anchor="middle">Client</text><text class="sub mono" x="96.0" y="59.5" text-anchor="middle">browser or app</text><rect class="mask" x="198.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="198.0" y="20" width="164" height="52" rx="6"/><text class="name" x="280.0" y="43.5" text-anchor="middle">Spring Boot API</text><text class="sub mono" x="280.0" y="59.5" text-anchor="middle">AuthService</text><rect class="mask" x="382.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="382.0" y="20" width="164" height="52" rx="6"/><text class="name" x="464.0" y="43.5" text-anchor="middle">PostgreSQL</text><text class="sub mono" x="464.0" y="59.5" text-anchor="middle">refresh_tokens</text><rect class="mask" x="554.0" y="20" width="164" height="52" rx="6"/><rect class="box" x="554.0" y="20" width="164" height="52" rx="6"/><text class="name" x="636.0" y="43.5" text-anchor="middle">Redis</text><text class="sub mono" x="636.0" y="59.5" text-anchor="middle">MFA challenges</text></svg>
