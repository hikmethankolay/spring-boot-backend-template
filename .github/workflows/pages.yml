name: Documentation site

# Builds the documentation website (scripts/site.sh) and deploys it to GitHub Pages
# (Settings > Pages > Source: GitHub Actions). Runs for every release tag; can also be started by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A repository made from the template has Pages off until its owner turns it on; skip instead of failing.
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # tags are needed for the version shown on the site

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # The Javadoc title shows the pom's version; use the latest release, as the site's home page does.
      - name: Set version from the latest tag
        run: |
          version=$(git describe --tags --abbrev=0 2>/dev/null) || exit 0   # no release yet: keep the pom's version
          ./mvnw -B -q versions:set -DnewVersion="${version#v}" -DgenerateBackupPoms=false

      - name: Build site (tests, OpenAPI export, Javadoc, coverage, Starlight)
        env:
          # Project site URL: https://<owner>.github.io/<repository>/
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
        run: scripts/site.sh

      # Same run as mutation.yml, so the badge shows the score of the released code.
      - name: Mutation testing
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage -Dthreads=2

      # shields.io endpoint files for the README's coverage and mutation score badges.
      - name: Badge data
        run: |
          badge() {
            local color=red
            if awk -v p="$2" 'BEGIN { exit !(p >= 90) }'; then
              color=brightgreen
            elif awk -v p="$2" 'BEGIN { exit !(p >= 75) }'; then
              color=yellow
            fi
            printf '{"schemaVersion":1,"label":"%s","message":"%s%%","color":"%s"}\n' "$1" "$2" "$color"
          }
          mkdir -p target/pages/badges
          # The last LINE counter in jacoco.xml is the total, as on the site's home page.
          coverage=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' target/site/jacoco/jacoco.xml \
            | tail -n 1 | sed -E 's/.*missed="([0-9]+)" covered="([0-9]+)".*/\1 \2/' \
            | awk '{ printf "%.1f", 100 * $2 / ($1 + $2) }')
          killed=$(grep -o "detected='true'" target/pit-reports/mutations.xml | wc -l)
          total=$(grep -o "<mutation " target/pit-reports/mutations.xml | wc -l)
          mutation=$(awk -v k="$killed" -v t="$total" 'BEGIN { printf "%.0f", 100 * k / t }')
          badge coverage "$coverage" > target/pages/badges/coverage.json
          badge "mutation score" "$mutation" > target/pages/badges/mutation.json
          cat target/pages/badges/*.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages

  # Deploys the built site; needs no access to the repository contents.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
