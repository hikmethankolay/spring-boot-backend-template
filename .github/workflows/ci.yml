name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/site/jacoco/

  # Runs the .bat scripts, so they cannot silently drift from their .sh counterparts. The Windows runner has no
  # Linux containers, so only the scripts that need none run here; the build job covers the integration tests.
  windows:
    name: Windows scripts
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit tests
        run: scripts\test.bat --unit

      - name: Documentation
        run: scripts\docs.bat

      - name: Build jar
        run: scripts\build.bat --skip-tests

  image:
    name: Docker image and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build image
        run: docker build -t app:ci .

      # Fails on fixable critical/high vulnerabilities in the OS packages or Java dependencies.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To list the commits of a pull request.
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Scans the pushed or pull request commits with the rules in .gitleaks.toml; findings from this repository's
      # history are listed in .gitleaksignore. Free for repositories of personal accounts; an organisation needs a
      # free GITLEAKS_LICENSE secret.
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          # The action's default (8.24.3) predates the [[allowlists]] syntax of .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1

  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Throwaway secrets: the scan only needs the app to start.
      - name: Start the app
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')"
            echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 48 | tr -d '\n/+=')"
          } > .env
          docker compose --profile app up --build --detach --wait
          # The distroless image has no healthcheck; wait until the app reports ready.
          curl --silent --show-error --fail --retry 30 --retry-all-errors --retry-delay 2 \
            http://localhost:8080/actuator/health/readiness

      # Passive scan of the running app; fails on any alert that .zap/rules.tsv does not ignore with a reason.
      - name: Scan with ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 # 2.17.0
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report

      - name: Show the app log
        if: failure()
        run: docker compose --profile app logs app

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate documentation (fails on undocumented code)
        run: scripts/docs.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-documentation
          path: target/reports/apidocs/

  # Renames the checkout the way a new project does, then runs the unit tests, so rename-project cannot leave
  # the template's package or repository links behind. Only in the template: a renamed project cannot be renamed again.
  rename:
    name: Rename project
    if: github.repository == 'hikmethankolay/spring-boot-backend-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rename
        run: scripts/rename-project.sh --repo Acme/Order-Service com.acme order-service com.acme.orders

      # Left on purpose: the README's author line, the template remote in "Getting fixes from the template later"
      # and this job's own guard.
      - name: No template references left
        run: |
          if git grep -n -e hikmethankolay -e spring-boot-backend-template -- . ':!scripts/rename-project.sh' \
              ':!docs/package-lock.json' ':!docs/src/content/docs/guides/new-project.md' ':!.github/workflows/ci.yml' \
              | grep -v 'Hikmethan Kolay'; then
            exit 1
          fi

      - name: Unit tests
        run: scripts/test.sh --unit

  # Generates the client from api/openapi.json and type-checks it, so an API change cannot break it unnoticed.
  # (scripts/client.bat is not run on Windows: the runner has no Linux containers.)
  clients:
    name: API client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Generate the TypeScript client
        run: scripts/client.sh

      - name: Type-check it
        run: >-
          find target/client/typescript-fetch -name '*.ts' -exec
          npx --yes -p typescript@5.9.3 tsc --noEmit --strict --target es2022 --module esnext
          --moduleResolution bundler --lib es2022,dom {} +
