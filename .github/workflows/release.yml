name: Release

# Pushing a tag like v2.1.0 tests the code, publishes the Docker image to GitHub Container Registry
# (ghcr.io/<owner>/<repo>:2.1.0 and :latest) for linux/amd64 and linux/arm64 with an SBOM and
# build provenance, signs it with Sigstore cosign (keyless) and creates a GitHub release with the
# signed SBOM and its SLSA provenance. Then it pins the image digest in deploy/kubernetes on main.
# scripts/release.sh makes the release commit and pushes the tag.
# Actions are pinned to commit SHAs (the SLSA generator to a tag, see below); Dependabot keeps them up to date.
on:
  push:
    tags: ['v*']

# Tests run in their own job without write access, so test code and test dependencies never hold
# the rights to publish or sign.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: ./mvnw -B verify

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # OIDC token for keyless cosign signing.
      id-token: write
    outputs:
      # Release assets the provenance job attests, as base64 "sha256  name" lines.
      hashes: ${{ steps.assets.outputs.hashes }}
      # The pushed image index, which pin-digest records in deploy/kubernetes.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The image build packages the pom's version, so the jar reports the release (v2.1.0 -> 2.1.0), not a snapshot.
      - name: Set version from tag
        run: ./mvnw -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Installs cosign 3, which signs in the Sigstore bundle format (stored as an OCI referrer of the image).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the image digest (all tags point to it); verify with the command in the Production guide.
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"

      # Proves the published image verifies with the same command users run (Production guide).
      - name: Verify signature and provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          cosign verify "$image" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          docker buildx imagetools inspect "$image" --format '{{ json (index .Provenance "linux/amd64").SLSA }}' \
            | jq -e '.buildType // .buildDefinition.buildType' > /dev/null
          docker buildx imagetools inspect "$image" --format '{{ json (index .SBOM "linux/amd64").SPDX }}' > sbom.spdx.json

      # Keyless signature of the SBOM, verifiable with cosign verify-blob (see the Production guide).
      - name: Sign SBOM
        id: assets
        run: |
          cosign sign-blob --yes --bundle sbom.spdx.json.sigstore.json sbom.spdx.json
          echo "hashes=$(sha256sum sbom.spdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            sbom.spdx.json sbom.spdx.json.sigstore.json

  # Pins the published digest in deploy/kubernetes on main, so the manifests deploy exactly the signed image (Production
  # guide, Releasing to Kubernetes). Skipped for pre-releases, and when main's manifests are at another version.
  pin-digest:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Pin the digest on main
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          escaped="${version//./\\.}"
          if ! grep -Eq "^ *newTag: \"$escaped\"$" deploy/kubernetes/kustomization.yaml; then
            echo "::notice::deploy/kubernetes on main is not at $version; digest not pinned."
            exit 0
          fi
          sed -i -E "s/^( *digest: )sha256:[0-9a-f]{64}$/\1$DIGEST/" deploy/kubernetes/kustomization.yaml
          sed -i -E "s/(image: [^:]+:$escaped@)sha256:[0-9a-f]{64}/\1$DIGEST/" deploy/kubernetes/migrate-job.yaml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "chore(deploy): pin the $version image digest"
          git push origin main

  # SLSA level 3 provenance for the release assets, attached as sbom.spdx.json.intoto.jsonl.
  # The generator must be referenced by tag (not SHA) so slsa-verifier can check the builder.
  provenance:
    needs: release
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: sbom.spdx.json.intoto.jsonl
      upload-assets: true
