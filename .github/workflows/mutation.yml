name: Mutation testing

# PIT mutates the security and auth code and checks that the tests notice. Too slow for every
# pull request, so it runs weekly and on demand; the report is uploaded as an artifact.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pitest:
    name: PIT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests start PostgreSQL and Redis with Testcontainers (Docker is available on the runner).
      - name: Mutation testing (fails below the threshold in pom.xml)
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage -Dthreads=2

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: target/pit-reports/
