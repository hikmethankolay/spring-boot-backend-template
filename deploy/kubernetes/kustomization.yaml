# Production manifests. Build with:  kubectl kustomize deploy/kubernetes
# Apply with:  kubectl apply -k deploy/kubernetes   (after creating the app-secrets Secret, see README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backend
labels:
  - pairs:
      app.kubernetes.io/name: spring-boot-template
    includeSelectors: true
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  # A pinned release, so every apply deploys the same, signed image. scripts/release.sh bumps newTag; the release
  # workflow's pin-and-tag job then commits the digest of the published image and tags that commit. With both, the
  # pods run name:tag@digest, so a moved tag cannot change what runs. migrate-job.yaml is kept on the same image.
  - name: ghcr.io/hikmethankolay/spring-boot-backend-template
    newTag: "5.0.0"
    digest: sha256:0d7963e73b84c92c41dc8a7fabedc530363f19cc6d3cd82e671ffe1bc419a65f
