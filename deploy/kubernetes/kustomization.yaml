# Production manifests. Build with:  kubectl kustomize deploy/kubernetes
# Apply with:  kubectl apply -k deploy/kubernetes   (after creating the app-secrets Secret, see README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backend
labels:
  - pairs:
      app.kubernetes.io/name: spring-boot-template
    includeSelectors: true
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  # A pinned release, so every apply deploys the same, signed image. scripts/release.sh bumps newTag; the release
  # workflow's pin-digest job then commits the digest of the published image. With both, the pods run
  # name:tag@digest, so a moved tag cannot change what runs. migrate-job.yaml is kept on the same image.
  - name: ghcr.io/hikmethankolay/spring-boot-backend-template
    newTag: "4.0.3"
    digest: sha256:8d8b210cab92d26acb4f4ca0c2c8a16bab5298cf8348350fe879c68b0925d717
