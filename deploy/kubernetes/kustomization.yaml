# Production manifests. Build with:  kubectl kustomize deploy/kubernetes
# Apply with:  kubectl apply -k deploy/kubernetes   (after creating the app-secrets Secret, see README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backend
labels:
  - pairs:
      app.kubernetes.io/name: spring-boot-template
    includeSelectors: true
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  # A pinned release, so every apply deploys the same, signed image. The release commit bumps newTag; once the release
  # workflow has run, set digest to the one it prints (or the index digest on GHCR). With both, the pods run
  # name:tag@digest, so a moved tag cannot change what runs. Keep migrate-job.yaml on the same image.
  - name: ghcr.io/hikmethankolay/spring-boot-backend-template
    newTag: "4.0.1"
    digest: sha256:fe096493585ace9dbb36f124639976a59bb6c39d1360cf9e06a3ab366e62dcf9
