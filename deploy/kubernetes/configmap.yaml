# Non-secret settings; every variable is documented in the Configuration guide and .env.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  SPRING_PROFILES_ACTIVE: prod
  # migrate-job.yaml migrates with the schema owner's role; the app's role may only read and write rows.
  FLYWAY_ENABLED: "false"
  DB_URL: jdbc:postgresql://postgres:5432/app
  DB_POOL_SIZE: "10"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_SSL_ENABLED: "false"
  MAIL_HOST: smtp.example.com
  MAIL_PORT: "587"
  # Must be your own domain: the prod profile refuses example.com senders.
  MAIL_FROM: no-reply@example.com
  MAIL_LINK_BASE_URL: https://app.example.com
  # Public URL of this API, for the one-click unsubscribe header of optional emails.
  MAIL_UNSUBSCRIBE_BASE_URL: https://api.example.com
  CORS_ALLOWED_ORIGINS: https://app.example.com
  # Used only when GITHUB_* or GOOGLE_* credentials are in the secret.
  OAUTH2_REDIRECT_URI: https://app.example.com/oauth2/callback
  # Tomcat takes the client IP from the rightmost X-Forwarded-For entry that is not an internal
  # (private-range) proxy, so a value a client puts in the header itself is ignored.
  FORWARD_HEADERS_STRATEGY: native
