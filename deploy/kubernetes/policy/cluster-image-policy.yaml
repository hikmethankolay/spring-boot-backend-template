# Admission policy for the Sigstore policy-controller (https://docs.sigstore.dev/policy-controller/overview/): in
# namespaces labelled policy.sigstore.dev/include=true (namespace.yaml), pods may run this image only if it was signed
# keylessly by this repository's release workflow on a v* tag (SLSA v1.0 verification). Install the policy-controller
# first, then: kubectl apply -f deploy/kubernetes/policy/
# Not part of kustomization.yaml, so clusters without the controller can still apply the rest.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: spring-boot-backend-template
spec:
  images:
    - glob: ghcr.io/hikmethankolay/spring-boot-backend-template**
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: ^https://github\.com/hikmethankolay/spring-boot-backend-template/\.github/workflows/release\.yml@refs/tags/v.*$
      ctlog:
        url: https://rekor.sigstore.dev
