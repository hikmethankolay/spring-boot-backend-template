apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Longer than Spring's graceful shutdown (30s) plus the preStop pause.
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: spring-boot-template
      containers:
        - name: app
          image: ghcr.io/hikmethankolay/spring-boot-backend-template
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving while the endpoint is removed from the Service, then shut down gracefully. The kubelet
              # waits itself (Kubernetes 1.30+): the distroless image has no sleep command.
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # One file per key, read by spring.config.import (configtree); not exposed as environment variables.
            - name: secrets
              mountPath: /etc/app/secrets
              readOnly: true
      volumes:
        # DB_USERNAME, DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET, MFA_ENCRYPTION_KEY, SPRING_MAIL_USERNAME,
        # SPRING_MAIL_PASSWORD, and optionally ADMIN_USERNAME/ADMIN_EMAIL/ADMIN_PASSWORD and the
        # GITHUB_/GOOGLE_CLIENT_ID and _CLIENT_SECRET of social login.
        - name: secrets
          secret:
            secretName: app-secrets
            # Readable by the app's group (fsGroup) only.
            defaultMode: 0440
        # Tomcat and the JVM need a writable /tmp; the rest of the filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
