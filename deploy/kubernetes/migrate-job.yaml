# Runs the database migrations with the schema owner's role, then exits; the app runs with FLYWAY_ENABLED=false and a
# role that may only read and write rows. Not part of kustomization.yaml: a Job's pod template cannot be changed in
# place. Run it before every rollout (see README.md):
#   kubectl -n backend delete job migrate --ignore-not-found
#   kubectl apply -f deploy/kubernetes/migrate-job.yaml
#   kubectl -n backend wait --for=condition=complete job/migrate --timeout=10m
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: backend
  labels:
    app.kubernetes.io/name: spring-boot-template
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        # Not app.kubernetes.io/name: the Deployment, HPA, PDB and Service select the app's pods by it. Matched by
        # the NetworkPolicy below.
        app.kubernetes.io/part-of: spring-boot-template
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # The same image as kustomization.yaml pins; KubernetesManifestTest keeps the two equal.
          image: ghcr.io/hikmethankolay/spring-boot-backend-template:5.2.0@sha256:d7a3eb79e7bcc9ec7c02f953713b128bd3cb4491b00434f7efe5b467074cf827
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # Runs Flyway and nothing else (application-migrate.yml).
            - name: SPRING_PROFILES_ACTIVE
              value: prod,migrate
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /etc/app/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # DB_USERNAME and DB_PASSWORD of the schema owner, nothing else.
        - name: secrets
          secret:
            secretName: app-migrator-secrets
            defaultMode: 0440
---
# The Job's own policy (the app's in networkpolicy.yaml selects app.kubernetes.io/name): DNS and PostgreSQL only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: spring-boot-template
      app.kubernetes.io/component: migrate
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
