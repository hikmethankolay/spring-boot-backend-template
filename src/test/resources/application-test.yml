app:
  jwt:
    secret: test-secret-that-is-at-least-32-characters-long
  login:
    max-attempts: 3
    account-max-attempts: 5
    # Below account-max-attempts, so MfaIntegrationTest reaches it first.
    mfa-max-attempts: 4
  rate-limit:
    # High enough for the whole suite (all requests come from 127.0.0.1); RateLimitIntegrationTest lowers it.
    requests-per-minute: 5000
    # The route limits would throttle the suite; RateLimitIntegrationTest sets its own.
    routes: []
  access-tokens:
    # The default caps tokens at USER; AccessTokenIntegrationTest also covers administrators' tokens and the cap.
    max-role: OWNER
  webhooks:
    encryption-key: test-webhook-encryption-key-0123456789abcdef
    # The tests' receiver listens on 127.0.0.1; WebhookAddressPolicyTest checks the production refusal.
    allow-private-addresses: true
    # Tests call WebhookDispatcher.deliverDue() themselves.
    poll-interval: 1h
    connect-timeout: 2s
    response-timeout: 2s
    # Small, so the retry and turn-off tests reach the limits in a few steps.
    max-attempts: 3
    disable-after-failures: 5
  mail:
    # Tests call EmailOutbox.sendDue() themselves; a background retry would race with them.
    outbox-poll-interval: 1h
    # Small batches, so the broadcast test crosses batch boundaries with the users the suite creates.
    broadcast-batch-size: 3
    security-alerts:
      # Off so tests of other features get no extra emails; the alert tests turn them on.
      enabled: false
  admin:
    username: admin
    email: admin@example.com
    password: Admin#12345-passphrase
  mfa:
    encryption-key: test-mfa-key-that-is-at-least-32-characters
  social-login:
    # Fake credentials: SocialLoginIntegrationTest replaces the calls to GitHub with a mock.
    github:
      client-id: test-client-id
      client-secret: test-client-secret
