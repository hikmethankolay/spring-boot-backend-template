# Every value can be overridden with an environment variable or a .env file in the working directory.
# See .env.example for the full list.
spring:
  application:
    name: spring-boot-template
  config:
    # Optional .env file in the working directory; DOTENV_PATH points elsewhere (tests disable it).
    import: optional:file:${DOTENV_PATH:.env}[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
    hikari:
      # Size it with the database's max_connections in mind: instances x pool size must fit.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast (503-like errors) instead of queueing requests for 30s when the pool is exhausted.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      data-source-properties:
        # Server-side guard rails: a runaway query or a transaction left open cannot hold
        # connections and locks forever. Flyway uses the same settings; raise DB_STATEMENT_TIMEOUT
        # (or set it to 0) for a migration that needs longer.
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT:30s} -c idle_in_transaction_session_timeout=${DB_IDLE_IN_TRANSACTION_TIMEOUT:60s}"
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    # Databases created before Flyway was introduced (they already have the users table) are
    # baselined at version 1 instead of failing; fresh databases run every migration.
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Leave empty for a Redis without authentication (local development).
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      # Short timeouts: when Redis is down, requests fall back to the database quickly.
      connect-timeout: 500ms
      timeout: 500ms
    web:
      pageable:
        max-page-size: 100
        # Pages are serialized as {"content":[...],"page":{"size","number","totalElements","totalPages"}}.
        serialization-mode: via-dto
  mail:
    # Defaults point to Mailpit from compose.yaml (web UI: http://localhost:8025).
    # Set SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD for a real SMTP server.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      # Encrypts the connection whenever the server offers STARTTLS (Mailpit does not); the prod profile requires it.
      "[mail.smtp.starttls.enable]": true
  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:10m}
      # Keys look like "spring-boot-template:users::42", so several apps can share one Redis.
      key-prefix: "${spring.application.name}:"
      cache-null-values: false
  threads:
    virtual:
      enabled: true
  web:
    # Error and validation messages are always English, whatever the server's OS locale.
    # Switch the resolver to "accept-header" and add messages_xx.properties to localise them.
    locale: en
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  # Set to "native" when running behind a trusted reverse proxy: Tomcat then uses the rightmost
  # X-Forwarded-For entry that is not an internal proxy. Otherwise X-Forwarded-For is ignored
  # (clients can spoof it). Avoid "framework", which trusts the leftmost, client-supplied entry.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful

management:
  health:
    redis:
      # The app keeps working without Redis (cache, lockout and rate limit fail open), so it must not mark the app DOWN.
      enabled: false
    mail:
      # Mail failures are logged and retried by the user; an SMTP outage must not mark the app DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Publishes latency buckets, so Prometheus can compute p95/p99 across instances
        # (used by ops/prometheus/alerts.yml and the Grafana dashboard).
        "[http.server.requests]": true
      slo:
        # An exact 300ms bucket for the latency SLO (ops/prometheus/alerts.yml).
        "[http.server.requests]": 300ms
  otlp:
    metrics:
      export:
        # Metrics are scraped from /actuator/prometheus. The OpenTelemetry starter would also push them to
        # localhost:4318 every minute, which fails without a collector. To push instead, set
        # OTLP_METRICS_EXPORT_ENABLED=true and MANAGEMENT_OTLP_METRICS_EXPORT_URL=http://otel-collector:4318/v1/metrics
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    # Share of requests that are traced and exported. Trace ids are in the logs and in the
    # X-Trace-Id header either way. Export is off until an OTLP endpoint is set, e.g.
    # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Responses are JSON (errors are application/problem+json); without this, springdoc documents "*/*".
  default-produces-media-type: application/json
  # Stable key order, so the committed api/openapi.json only changes when the API does.
  writer-with-order-by-keys: true
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

app:
  jwt:
    # HS256 (shared secret) or RS256 (private key, public keys served at /.well-known/jwks.json).
    algorithm: ${JWT_ALGORITHM:HS256}
    # Comma-separated: the first key signs, all keys verify (key rotation, see the Security guide).
    secret: ${JWT_SECRET:}
    private-key: ${JWT_PRIVATE_KEY:}
    issuer: ${spring.application.name}
    # Access tokens (JWTs) cannot be revoked cheaply, so keep them short; clients renew them with the refresh token.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    # A session ends after this much inactivity (no refresh); "remember me" sessions use the longer value.
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:1d}
    remember-me-ttl: ${JWT_REMEMBER_ME_TTL:30d}
  cookie:
    name: auth_token
    refresh-name: refresh_token
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    account-max-attempts: ${LOGIN_ACCOUNT_MAX_ATTEMPTS:100}
    lock-duration: ${LOGIN_LOCK_DURATION:1h}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  account:
    # true in the prod profile: unverified users cannot log in.
    require-verified-email: ${REQUIRE_VERIFIED_EMAIL:false}
    verification-token-ttl: 24h
    password-reset-token-ttl: 1h
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    # Frontend that handles /verify-email?token=... and /reset-password?token=... links.
    link-base-url: ${MAIL_LINK_BASE_URL:http://localhost:3000}
    # Emails go through an outbox table and are retried with exponential backoff while SMTP fails
    # (30s, 1m, 2m, ... capped at 1h); after max-attempts they are dropped and an error is logged.
    max-attempts: ${MAIL_MAX_ATTEMPTS:10}
    retry-delay: ${MAIL_RETRY_DELAY:30s}
    outbox-poll-interval: ${MAIL_OUTBOX_POLL_INTERVAL:10s}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mfa:
    # Encrypts the TOTP secrets in the database (AES-GCM): at least 32 random characters, kept out of the
    # database and its backups. Changing it breaks every enrolled authenticator (recovery codes still work).
    encryption-key: ${MFA_ENCRYPTION_KEY:}
    # Time between a correct password and the authenticator code.
    challenge-ttl: ${MFA_CHALLENGE_TTL:5m}
  social-login:
    # Frontend page GitHub and Google redirect to with ?code=...&state=...; register it at both providers.
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
    # A provider is enabled when both values are set.
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
