<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
    <p>Confirm that this email address belongs to you.</p>
    <th:block th:replace="~{button.html :: button(${link}, 'Confirm email address')}"></th:block>
    <p>The link expires in <span th:text="${ttl}">24 hours</span>. If you did not ask for this, ignore this email.</p>
</th:block>
</body>
</html>
