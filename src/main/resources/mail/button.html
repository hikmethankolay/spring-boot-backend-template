<!--/*
  Call-to-action button for HTML emails: ~{button.html :: button(${link}, 'Label')}. The padding and colour sit on
  the table cell, not the link ("bulletproof" button), so it keeps its size in Outlook and in clients without
  display: inline-block; the raw URL follows for clients that block the button.
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="button(href, label)">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td style="padding: 12px 24px; background-color: #2563eb; font-family: Arial, Helvetica, sans-serif; font-size: 16px">
                <a th:href="${href}" style="color: #ffffff"><b th:text="${label}">Label</b></a>
            </td>
        </tr>
    </table>
    <p>If the button does not work, open this link:<br>
        <a th:href="${href}" th:text="${href}">https://example.com</a></p>
</th:block>
