<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
    <p>Someone asked to reset the password of your account. If that was you, choose a new password:</p>
    <th:block th:replace="~{button.html :: button(${link}, 'Reset password')}"></th:block>
    <p>The link expires in <span th:text="${ttl}">1 hour</span>. If you did not ask for this, ignore this email:
        your password stays the same.</p>
</th:block>
</body>
</html>
