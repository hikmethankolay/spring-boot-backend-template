<!DOCTYPE html>
<!--/*
  Layout of every HTML email. A page template replaces its <html> element with
  ~{layout.html :: layout(~{::content})} and supplies only a th:block th:fragment="content".

  Styles are inline attributes here and in button.html only: many email clients drop <style> blocks. The content
  cell sets font-family, font-size, line-height and color, which the paragraphs and links inside inherit, so page
  templates need no styles. Use tables, inline style attributes and only these widely supported properties:
  font-family, font-size, color, background-color, padding, border, line-height, width, max-width. Prefer HTML where
  it does the same job: <b> for bold, align="center" for centering. Avoid margin, border-radius, display,
  text-align, word-break and text-decoration, which many clients (Outlook, Gmail apps) ignore or support only in
  part; Mailpit's HTML Check lists the support of each. No flexbox, grid, <style> blocks or external CSS.

  The footer adds an unsubscribe link only for optional categories: MailRenderer sets unsubscribeUrl, categoryName
  and preferencesUrl for those and clears them for transactional emails.

  Values go through th:text or th:href, which escape them. Never th:utext or [(...)]: they do not escape.
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Subject</title>
</head>
<!--/* No <body> tag (HTML allows leaving it out): clients replace or strip it, and the outer table paints the page. */-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f5">
    <tr>
        <td align="center" style="padding: 24px 16px">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width: 600px; background-color: #ffffff; border: 1px solid #e4e4e7">
                <tr>
                    <td style="padding: 24px 32px 0; font-family: Arial, Helvetica, sans-serif; font-size: 18px; color: #18181b"><b
                        th:text="${appName}">App</b></td>
                </tr>
                <tr>
                    <td style="padding: 8px 32px 24px; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #27272a">
                        <th:block th:replace="${content}">Content</th:block>
                    </td>
                </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px">
                <tr>
                    <td align="center" style="padding: 16px 32px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; color: #71717a">
                        Sent by <span th:text="${appName}">App</span>.
                        <th:block th:if="${unsubscribeUrl}"><br>
                            <a th:href="${unsubscribeUrl}" style="color: #71717a">Unsubscribe from
                                <span th:text="${categoryName}">Product updates</span></a>
                            ·
                            <a th:href="${preferencesUrl}" style="color: #71717a">Manage email preferences</a>
                        </th:block>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</html>
