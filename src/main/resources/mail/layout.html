<!DOCTYPE html>
<!--/*
  Layout of every HTML email. A page template replaces its <html> element with
  ~{layout.html :: layout(~{::content})} and supplies only a th:block th:fragment="content".

  Styles are inline attributes here and in button.html only: many email clients drop <style> blocks. The content
  cell sets font-family, font-size, line-height and color, which the paragraphs and links inside inherit, so page
  templates need no styles. Use tables, inline style attributes and only these properties: font-family, font-size,
  font-weight, color, background-color, padding, margin, border, border-radius, text-align, text-decoration,
  line-height, width, max-width, display, word-break. No flexbox, grid, <style> blocks or external CSS.

  Values go through th:text or th:href, which escape them. Never th:utext or [(...)]: they do not escape.
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Subject</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f5">
    <tr>
        <td align="center" style="padding: 24px 16px">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width: 600px; background-color: #ffffff; border: 1px solid #e4e4e7; border-radius: 8px">
                <tr>
                    <td style="padding: 24px 32px 0; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; color: #18181b"
                        th:text="${appName}">App</td>
                </tr>
                <tr>
                    <td style="padding: 8px 32px 24px; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #27272a">
                        <th:block th:replace="${content}">Content</th:block>
                    </td>
                </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px">
                <tr>
                    <td style="padding: 16px 32px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; color: #71717a; text-align: center">
                        Sent by <span th:text="${appName}">App</span>.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
